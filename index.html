<style>
/* Layout: sticky progress header over a single reading column of domain panels; each case is a tick row that expands to its notes. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f8; --line:#d9e1e3;
  --fg:#16252b; --muted:#5b6d74; --accent:#0f6e7a; --accent-soft:#d6ecee;
  --done:#2c8a55; --done-soft:#e3f3e9; --hot:#b4471f; --hot-soft:#fbe7dd;
  --c-rnh:#c2417a; --c-gp:#2f6fc0; --c-ah2:#c4701a; --c-cah:#7b4fc4; --c-mh:#13877a; --c-ah1:#c23a3a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1619; --surface:#152126; --surface-2:#1a2930; --line:#26383f;
  --fg:#e3ecee; --muted:#93a7ad; --accent:#5cc3cf; --accent-soft:#183c42;
  --done:#5ccb8a; --done-soft:#173326; --hot:#f08a5d; --hot-soft:#3a2219;
  --c-rnh:#ec7aab; --c-gp:#73a6ec; --c-ah2:#eba35a; --c-cah:#ad8bf0; --c-mh:#4fcfbf; --c-ah1:#f07878;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#152126; --surface-2:#1a2930; --line:#26383f;
  --fg:#e3ecee; --muted:#93a7ad; --accent:#5cc3cf; --accent-soft:#183c42;
  --done:#5ccb8a; --done-soft:#173326; --hot:#f08a5d; --hot-soft:#3a2219;
  --c-rnh:#ec7aab; --c-gp:#73a6ec; --c-ah2:#eba35a; --c-cah:#ad8bf0; --c-mh:#4fcfbf; --c-ah1:#f07878;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px -14px rgba(10,40,50,.35)}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:-.01em;margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;margin-top:2px}
.score{text-align:right;font-variant-numeric:tabular-nums}
.score b{font-family:var(--f-display);font-weight:800;font-size:1.9rem;color:var(--accent);line-height:1}
.score span{display:block;font-size:.8rem;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.bar i{display:block;height:100%;transition:width .4s ease}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input[type=search]{flex:1 1 180px;min-width:0;font:inherit;font-size:.9rem;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--fg)}
.chipbtn{font:inherit;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sync{font-size:.75rem;color:var(--muted)}

section.domain{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.code{font-family:var(--f-mono);font-size:.75rem;font-weight:500;padding:4px 7px;border-radius:6px;color:var(--surface);background:var(--dc)}
.dhead h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0;flex:1;min-width:0}
.dcount{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dcount.full{color:var(--done)}
.minibar{height:3px;background:var(--surface-2)}
.minibar i{display:block;height:100%;background:var(--dc);transition:width .4s ease}
.kind{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:8px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}

.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.done{background:var(--done-soft)}
.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px}
.tick{flex:none;width:24px;height:24px;margin-top:1px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{opacity:0}
.done .tick{background:var(--done);border-color:var(--done)}
.done .tick svg{opacity:1}
.tick:focus-visible,.toggle:focus-visible,.chipbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toggle{flex:1;min-width:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.tmain{min-width:0;display:flex;flex-direction:column;gap:5px}
.ttl{font-weight:700;font-size:.97rem}
.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.meta{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag.rep{background:var(--hot-soft);color:var(--hot);border-color:transparent}
.chev{flex:none;color:var(--muted);transition:transform .2s;margin-top:2px}
.open .chev{transform:rotate(180deg)}
.notes{padding:0 16px 14px 52px}
.notes ul{margin:0;padding:0 0 0 2px;list-style:none;display:flex;flex-direction:column;gap:5px;border-left:2px solid var(--dc);padding-left:12px}
.notes li{font-size:.9rem;color:var(--fg)}
.notes li.mn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.prac{flex:none;align-self:center;font-size:.78rem;font-weight:700;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px}
.prac:hover{filter:brightness(.95)}
.prac:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.reset{align-self:center;font:inherit;font-size:.8rem;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.confirm{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:.85rem}
.confirm button{font:inherit;font-size:.8rem;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.confirm .danger{background:var(--hot);color:var(--surface);border-color:transparent}
@media (max-width:480px){h1{font-size:1.3rem}.score b{font-size:1.5rem}.notes{padding-left:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

// Parse titles into name, year tag, repeat count
function parse(t){
  const rep=t.match(/\(x(\d+) Repeats\)/);const yr=t.match(/\((\d{4})\)\s*$/);
  const name=t.replace(/\s*\(x\d+ Repeats\)/,'').replace(/\s*\(\d{4}\)\s*$/,'');
  return {name,rep:rep?+rep[1]:0,year:yr?yr[1]:''};
}

const PRACTICE='practice.html';
const LS='osce-checklist-v1';
let checks={};try{checks=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){}
const open=new Set();let fTodo=false,fRep=false,q='',confirming=false;
let remote=null;

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tickSvg='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const chev='<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>';

function done(id){return !!checks[id]}
function match(t){
  if(fTodo&&done(t.id))return false;
  if(fRep&&!t.rep)return false;
  if(q){const hay=(t.title+' '+t.b.join(' ')+' '+t.d.code+' '+t.d.title).toLowerCase();if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
  return true;
}
function itemHtml(t){
  const isO=open.has(t.id),isD=done(t.id);
  const notes=t.b.map(x=>x.startsWith('Mnemonic:')?`<li class="mn">${esc(x)}</li>`:`<li>${esc(x)}</li>`).join('');
  return `<div class="item${isD?' done':''}${isO?' open':''}" data-id="${t.id}">
    <div class="row">
      <button class="tick" data-act="tick" aria-pressed="${isD}" aria-label="${isD?'Mark as not done':'Mark as done'}: ${esc(t.name)}">${tickSvg}</button>
      <button class="toggle" data-act="open" aria-expanded="${isO}">
        <span class="tmain"><span class="ttl">${esc(t.name)}</span>
        <span class="meta">${t.year?`<span class="tag">${t.year}</span>`:''}${t.rep?`<span class="tag rep">×${t.rep} repeats</span>`:''}</span></span>${chev}
      </button>
      <a class="prac" href="${PRACTICE}#${t.id}" aria-label="Practise ${esc(t.name)}">Practise</a>
    </div>
    ${isO?`<div class="notes"><ul>${notes}</ul></div>`:''}
  </div>`;
}
function render(){
  const total=ALL.length,n=ALL.filter(t=>done(t.id)).length,p=Math.round(n/total*100);
  $('#pct').textContent=p+'%';$('#cnt').textContent=`${n} / ${total} completed`;
  $('#bar').innerHTML=D.map(d=>{const c=[...d.clinical,...d.exams].filter(t=>done(t.id)).length;return `<i title="${d.code}: ${c}" style="width:${c/total*100}%;background:var(${d.c})"></i>`}).join('');
  let html='',shown=0;
  D.forEach(d=>{
    const all=[...d.clinical,...d.exams],c=all.filter(t=>done(t.id)).length;
    const cl=d.clinical.filter(match),ex=d.exams.filter(match);
    if(!cl.length&&!ex.length)return;shown++;
    html+=`<section class="domain" style="--dc:var(${d.c})">
      <div class="dhead"><span class="code">${d.code}</span><h2>${esc(d.title)}</h2><span class="dcount${c===all.length?' full':''}">${c} / ${all.length}</span></div>
      <div class="minibar"><i style="width:${c/all.length*100}%"></i></div>
      ${cl.length?`<div class="kind">Clinical cases</div>${cl.map(itemHtml).join('')}`:''}
      ${ex.length?`<div class="kind">Examinations</div>${ex.map(itemHtml).join('')}`:''}
    </section>`;
  });
  $('#list').innerHTML=shown?html:`<div class="empty">No cases match these filters.</div>`;
  $('#resetZone').innerHTML=confirming
    ?`<div class="confirm">Clear all ${n} ticks? <button class="danger" data-act="reset-yes">Clear progress</button><button data-act="reset-no">Cancel</button></div>`
    :(n?`<button class="reset" data-act="reset">Reset progress</button>`:'');
}

let saveTimer=null;
function save(){
  try{localStorage.setItem(LS,JSON.stringify(checks))}catch(e){}
  if(!remote)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{remote.set({checks,updatedAt:Date.now()}).then(()=>setSync('Synced to your account'),()=>setSync('Sync failed · saved in this browser'))},400);
}
function setSync(t){$('#sync').textContent=t}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.closest('.item')?.dataset.id;
  if(act==='tick'){checks[id]=!checks[id];if(!checks[id])delete checks[id];save();render();document.querySelector(`.item[data-id="${id}"] .tick`)?.focus()}
  else if(act==='open'){open.has(id)?open.delete(id):open.add(id);render();document.querySelector(`.item[data-id="${id}"] .toggle`)?.focus()}
  else if(act==='reset'){confirming=true;render()}
  else if(act==='reset-no'){confirming=false;render()}
  else if(act==='reset-yes'){checks={};confirming=false;save();render()}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
function pill(id,fn){const b=$(id);b.addEventListener('click',()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);fn(v);render()})}
pill('#f-todo',v=>fTodo=v);pill('#f-rep',v=>fRep=v);
pill('#f-open',v=>{open.clear();if(v)ALL.forEach(t=>open.add(t.id));$('#f-open').textContent=v?'Collapse all':'Expand all'});

render();

// Sync progress to the viewer's account so it follows them across devices
(async()=>{
  try{
    if(!window.claude?.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    remote=db.collection('data/users/'+uid).doc('osce-progress');
    let first=true;
    remote.onSnapshot(snap=>{
      if(snap.exists){
        const r=snap.data()?.checks||{};const clean={};
        for(const k in r)if(IDS.has(k)&&r[k])clean[k]=true;
        if(first&&!Object.keys(clean).length&&Object.keys(checks).length){first=false;save();return}
        checks=clean;try{localStorage.setItem(LS,JSON.stringify(checks))}catch(e){}
        render();
      }else if(first&&Object.keys(checks).length){save()}
      first=false;setSync('Synced to your account');
    },()=>setSync('Saved in this browser'));
  }catch(e){}
})();
</script>

</body>
</html>
