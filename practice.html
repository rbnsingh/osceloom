{id:'gp-c1',t:'Migraine',k:['Hx','Couns'],yr:'2013',
role:'You are a GP registrar.',
stem:'Alice Chen, 27, has had recurrent headaches for the past year. They are becoming more frequent and she is missing work.',
tasks:['Take a focused headache history, including red flags.','Explain the likely diagnosis.','Develop a patient-centred management plan, including triggers and preventive options.'],
script:{who:'Alice, 27. Graphic designer.',open:'I\'m getting these awful headaches three or four times a month now.',
act:'Frustrated; has tried "everything".',
ask:['Left-sided throbbing headache, builds over an hour, lasts most of the day.','Nausea, hates light and noise; has to lie in a dark room.','Sees zigzag lines for 20 minutes before some headaches.','Triggers: poor sleep, skipped meals, red wine, before her period.','Takes ibuprofen + paracetamol 10 days a month; partial relief.','No fever, neck stiffness, weakness, morning vomiting or worst-ever headache.','On the combined pill. Mum has migraines.'],
raise:['Is it a brain tumour?','Can I stay on my pill?']},
eq:[['Why is her contraceptive important?','Migraine with aura is a contraindication to combined oestrogen-containing contraception because of increased ischaemic stroke risk. Switch to a progestogen-only method or IUD.']],
m:[['Introduces self, open question',1],['SOCRATES of headache',2],['Associated: nausea, photophobia, phonophobia, aura',2],['Red flags: thunderclap, fever, neck stiffness, focal neurology, morning/positional, >50, new onset',2],['Triggers and headache diary',1],['Medication use frequency (medication overuse headache)',1],['Contraception, family history, impact on work',1],['Explains migraine with aura',1],['Acute: NSAID/aspirin ± antiemetic early, triptan',2],['Advises limiting acute meds to <10 days/month',1],['Prevention option given frequency (e.g. propranolol, amitriptyline, candesartan)',2],['Stops combined pill due to aura; offers alternative',2],['Lifestyle: sleep, meals, hydration, exercise',1],['Follow-up and safety-net',1]],
ref:'eTG Neurology (Migraine); Migraine & Headache Australia.'},

{id:'gp-c2',t:'Paediatric Knee Pain – Osgood-Schlatter',k:['Hx','Exam'],yr:'2014',
role:'You are a GP registrar.',
stem:'Ella Brooks, 13, attends with her father. She has had pain below her right knee for 2 months. She plays netball and runs cross-country.',
tasks:['Take a focused history.','Perform a focused knee examination.','Interpret the X-ray and explain the diagnosis and management to Ella and her father.'],
script:{who:'Ella, 13, and her dad, Mark.',open:'It hurts right here under my kneecap when I run or kneel.',
act:'Ella is shy; Dad answers for her unless the candidate engages her.',
ask:['Pain over front of knee below kneecap, worse with running, jumping, kneeling, stairs.','Bump there that is tender.','No locking, giving way, swelling, night pain, fever or weight loss.','Growth spurt over the last year.','No trauma.'],
raise:['Will she need to stop sport?','Is it serious?'],
fx:['Tender, prominent tibial tuberosity. No effusion.','Full range of motion. Ligaments stable. Hip exam normal.','X-ray: fragmentation of tibial tuberosity apophysis, soft tissue swelling. No other abnormality.']},
m:[['Introduces self to child and parent; engages child directly',2],['Pain history: site, onset, aggravating activity',2],['Mechanical symptoms and trauma',1],['Red flags: night pain, fever, weight loss, swelling (tumour/infection)',2],['Exam: inspection, palpation incl. tibial tuberosity, effusion',2],['Range of movement, ligament tests, examines hip',2],['Interprets X-ray correctly',1],['Explains Osgood-Schlatter: traction apophysitis during growth, self-limiting',2],['Management: activity modification, ice, simple analgesia, quad/hamstring stretching',2],['Can continue sport as pain allows; resolves with skeletal maturity',1],['Safety-net and follow-up',1]],
ref:'RCH Clinical Practice Guidelines; RCH Kids Health Info.'},

{id:'gp-c3',t:'HSIL on Cervical Screening',k:'Couns',yr:'2015',
role:'You are a GP registrar.',
stem:'Jade Wilson, 29, is here for her cervical screening result. It shows "HPV (not 16/18) detected. Liquid-based cytology: high-grade squamous intraepithelial lesion (HSIL)". She had not been screened for 5 years before this test. She hopes to have another child soon.',
tasks:['Explain the result to Jade.','Discuss the next steps.','Address her concerns about fertility and future pregnancy.'],
script:{who:'Jade, 29. Has a 4-year-old.',open:'You said on the phone you wanted to see me. Is something wrong?',
act:'Becomes very anxious when she hears "abnormal cells".',
ask:['No bleeding or discharge.','Smoker, 10/day.','Long-term partner.','Not on contraception now; trying to conceive.'],
raise:['Do I have cancer?','Can I still get pregnant?','Will the treatment hurt my chances of carrying a baby?']},
eq:[['What is the treatment for confirmed HSIL (CIN2/3)?','Excisional treatment, usually large loop excision of the transformation zone (LLETZ), with test of cure (co-test) at 12 months and annually until 2 consecutive negative co-tests.']],
m:[['Introduces self, checks understanding, warns before giving result',2],['Explains HPV and its link to cervical changes',2],['Explains HSIL: precancerous, not cancer',2],['Refers for colposcopy (within 8 weeks)',2],['Explains colposcopy and biopsy',1],['Explains LLETZ if treatment needed',1],['Fertility: LLETZ does not reduce fertility; small increased risk of preterm birth',2],['Advises colposcopy and treatment before pregnancy if possible',1],['Smoking cessation advice',1],['Uses empathy, pauses, checks understanding',2],['Follow-up, written info, support',1]],
ref:'National Cervical Screening Program clinical guidelines.'},

{id:'gp-c4',t:'Sore Throat – Antibiotic Request',k:['Hx','Couns'],yr:'2018',
role:'You are a GP registrar.',
stem:'Josh Taylor, 23, has had a sore throat, cough and a sore chest from coughing for 3 days. He thinks he has had fevers. His friend told him to "get some antibiotics".',
tasks:['Take a focused history.','State the examination you would perform.','Explain your management to Josh.'],
script:{who:'Josh, 23. Apprentice electrician.',open:'Mate, I just need some antibiotics so I can get back to work.',
act:'Pushy about antibiotics; accepts reasoning if explained well.',
ask:['Sore throat, runny nose, dry cough for 3 days.','Felt hot, has not measured.','Able to swallow fluids. No drooling or voice change.','No rash. No recent travel.','Non-Indigenous, lives in Townsville, no history of rheumatic fever.','Needs a medical certificate.'],
raise:['Antibiotics worked last time.','What if it gets worse?'],
fx:['T 37.8 °C, HR 88, RR 16, sats 99%.','Mild pharyngeal erythema, no exudate. No cervical lymphadenopathy. Chest clear.']},
eq:[['Who should receive antibiotics for sore throat in Australia?','People at high risk of acute rheumatic fever (Aboriginal and Torres Strait Islander people in high-risk areas, Māori and Pacific Islander people, people with existing RHD), and those with suspected streptococcal pharyngitis with scarlet fever or severe symptoms. Phenoxymethylpenicillin for 10 days is first line.']],
m:[['Introduces self, explores ideas, concerns, expectations',2],['Symptom history: onset, cough, coryza, fever',1],['Red flags: difficulty swallowing, drooling, trismus, stridor (quinsy, epiglottitis)',2],['ARF risk factors (ethnicity, region, previous ARF/RHD)',2],['States exam: vitals, throat, lymph nodes, chest',1],['Explains viral infection likely; Centor/McIsaac low',1],['Explains why antibiotics will not help: side effects and resistance',2],['Symptomatic care: analgesia, gargles, fluids, rest',1],['Gives medical certificate',1],['Safety-net: worsening, not improving in 5–7 days, swallowing problems',2],['Non-confrontational, maintains rapport',1]],
ref:'eTG Antibiotic (Sore throat); RHDAustralia ARF/RHD guideline.'},

{id:'gp-c5',t:'Preventive Health & Tetanus',k:['Hx','Couns'],yr:'2019',
role:'You are a GP registrar.',
stem:'Ron Mitchell, 67, stepped on a rusty nail in his garden 2 days ago. The wound has been cleaned and dressed by the practice nurse. He also mentions he has had a cough.',
tasks:['Assess Ron\'s tetanus risk and immunisation status.','Explain tetanus management.','Use the opportunity to address his preventive health.'],
script:{who:'Ron, 67. Retired builder.',open:'The nurse cleaned my foot. Do I need a needle?',
act:'Not a fan of doctors; came in only because his wife insisted.',
ask:['Puncture wound sole of foot, dirty, through gardening shoe.','Last tetanus vaccine "in the army", about 40 years ago. Unsure if he completed the primary course.','Cough for 3 months, worse in mornings, some sputum. No blood. Weight stable.','Smokes 20/day for 50 years. 4 standard drinks/day.','Not been to GP in 5 years. Never had bowel screening done.','No diabetes.'],
raise:['Do I need antibiotics?','Why are you asking about smoking? I came about my foot.']},
eq:[['When is tetanus immunoglobulin indicated?','For tetanus-prone wounds when the person has had fewer than 3 doses of tetanus vaccine, or vaccination history is uncertain. Give tetanus immunoglobulin 250 IU IM and a tetanus-containing vaccine, then complete the primary course.']],
m:[['Introduces self',1],['Wound assessment: mechanism, contamination, time',1],['Tetanus history: number of doses, last dose',2],['Classifies as tetanus-prone wound',1],['Gives dT/dTpa booster and tetanus immunoglobulin (uncertain primary course)',2],['Plans catch-up primary course',1],['Explores cough: duration, sputum, haemoptysis, weight loss',2],['SNAP: smoking, nutrition, alcohol, physical activity',2],['Lung cancer screening eligibility / CXR; spirometry',1],['Recommends bowel screening (iFOBT), vaccines (flu, pneumococcal, shingles)',2],['Smoking cessation brief intervention (5As)',2],['Follow-up appointment',1]],
ref:'Australian Immunisation Handbook (Tetanus); RACGP Red Book.'},

{id:'gp-c6',t:'Poorly Controlled Asthma',k:['Hx','Couns'],yr:'2012, 2020',
role:'You are a GP registrar.',
stem:'Karen Lewis, 35, has asthma. She has needed her reliever almost every day for the past month and was woken by her asthma twice last week. Her husband smokes.',
tasks:['Take a history focused on asthma control and triggers.','Check her inhaler technique.','Develop an updated management plan, including a written asthma action plan.'],
script:{who:'Karen, 35. Cleaner.',open:'My puffer isn\'t working anymore. I\'m using it all the time.',
act:'Defensive when asked about adherence; admits she stopped the preventer "because it cost too much".',
ask:['Blue reliever (salbutamol) daily. Brown preventer (fluticasone) stopped 3 months ago.','Waking at night 2x last week.','Triggers: cleaning chemicals at work, husband smokes inside, dust, colds.','One ED visit last year. No ICU admissions.','Technique: puffs inhaler without a spacer, does not breathe out first, no breath hold.','No written action plan.'],
raise:['Why do I need the brown one if I feel okay?','Can\'t I just use the blue one?']},
eq:[['What is the role of budesonide-formoterol in Australian guidelines?','As-needed or maintenance-and-reliever therapy (MART) with low-dose budesonide-formoterol is an option at several steps, reducing severe exacerbations compared with SABA-only therapy.']],
m:[['Introduces self',1],['Assesses control: daytime symptoms, night waking, reliever use, activity limitation',2],['Exacerbation history: ED visits, steroids, ICU',1],['Adherence to preventer, explored non-judgementally; cost barrier',2],['Triggers: smoke, occupational, allergens, viral',2],['Checks inhaler technique and corrects; recommends spacer',2],['Explains preventer vs reliever in plain language',1],['Steps up/restarts preventer (ICS or ICS-LABA), considers cost options',1],['Writes asthma action plan with zones',2],['Addresses smoke exposure: husband quit support, smoke-free home',1],['Occupational trigger advice',1],['Review in 4–6 weeks; spirometry; flu vaccine',1]],
ref:'Australian Asthma Handbook (National Asthma Council).'},

{id:'gp-c7',t:'Back Pain – Compression Fracture',k:['Hx','Mx'],yr:'2021',
role:'You are a GP registrar.',
stem:'Joan Fletcher, 72, has had sudden mid-back pain for a week, which started when she lifted a bag of potting mix.',
tasks:['Take a focused history.','List the investigations you would order.','Interpret the X-ray provided and give your differential diagnoses.'],
script:{who:'Joan, 72. Widowed, lives alone.',open:'My back went bang when I lifted the potting mix, and it hasn\'t settled.',
act:'Stoic. Winces when moving.',
ask:['Sudden sharp pain mid-back, 8/10, worse moving, better lying still.','No leg weakness, numbness, bladder or bowel change.','No fever, weight loss or night sweats. No history of cancer.','Menopause at 45. Long-term prednisone for polymyalgia rheumatica 3 years ago.','Mother had a "dowager\'s hump". Fractured wrist after a fall 2 years ago.','Smoker.'],
raise:['Is it broken?','Will I end up in a wheelchair?'],
fx:['Thoracic spine X-ray: anterior wedge compression of T12, ~30% height loss. Osteopenic appearance. No other lesions.']},
eq:[['What are red flags that would suggest a pathological fracture?','History of malignancy, weight loss, night pain, fever, age under 50 without trauma, multiple fractures, or lytic lesions. Check ESR/CRP, serum and urine protein electrophoresis, and consider MRI.']],
m:[['Introduces self',1],['Pain history: onset, mechanism, character, severity',2],['Neurology: weakness, numbness, sphincter symptoms',2],['Red flags: cancer history, weight loss, fever, night pain',2],['Osteoporosis risk factors: steroids, early menopause, previous fracture, family history, smoking',2],['Investigations: FBC, UEC, LFT, calcium, vit D, TSH, ESR/CRP, SPEP; DXA',2],['Interprets X-ray: T12 wedge compression fracture',2],['DDx: osteoporotic fracture, malignancy (myeloma, metastases), infection',1],['Initial Mx: analgesia, mobilise, falls prevention',1],['Long-term: bisphosphonate/denosumab, calcium, vit D, exercise; minimal trauma fracture qualifies for PBS',2],['Safety-net and follow-up',1]],
ref:'Healthy Bones Australia / RACGP osteoporosis guideline 2024.'},

{id:'gp-c8',t:'Ankle Sprain – Ottawa Rules',k:['Hx','Exam'],yr:'2022',
role:'You are a GP registrar in a rural practice.',
stem:'Liam O\'Brien, 19, rolled his right ankle playing rugby league yesterday.',
tasks:['Take a focused history.','Examine the ankle.','Decide whether an X-ray is needed using the Ottawa ankle rules and explain your management.'],
script:{who:'Liam, 19. Wants to play next week.',open:'Rolled it in a tackle. Can you strap it so I can play Saturday?',
act:'Keen to downplay the injury.',
ask:['Foot rolled inwards (inversion).','Heard a pop. Swelled immediately.','Could take 4 steps after with a limp; walked into clinic limping.','No previous ankle injuries.','No numbness.'],
raise:['Can I play Saturday?','Do I need a scan?'],
fx:['Swelling and bruising over lateral ankle.','Tender over anterior talofibular ligament.','NOT tender at posterior edge or tip of either malleolus, base of 5th metatarsal or navicular.','Can weight-bear 4 steps. Anterior drawer: mild laxity. Neurovascularly intact.']},
eq:[['State the Ottawa ankle rules.','Ankle X-ray if pain in the malleolar zone AND bone tenderness at the posterior edge or tip of the lateral or medial malleolus (distal 6 cm), OR inability to bear weight for 4 steps both immediately and in ED. Foot X-ray if midfoot pain AND tenderness at base of 5th metatarsal or navicular, OR inability to bear weight.']],
m:[['Introduces self',1],['Mechanism of injury',1],['Ability to weight-bear immediately and now',1],['Swelling, pop, previous injury',1],['Exam: look (swelling, bruising), feel (malleoli, ATFL, 5th MT base, navicular)',2],['Move: active/passive range; special tests (anterior drawer, squeeze test for syndesmosis)',2],['Neurovascular check',1],['Correctly applies Ottawa rules: X-ray not needed',2],['Diagnosis: lateral ankle ligament sprain (grade I–II)',1],['Mx: early mobilisation, ice, compression, elevation, analgesia; brace/strap',2],['Physio rehab, proprioception; graded return to sport, not Saturday',2],['Safety-net: unable to weight-bear, worsening, numbness',1]],
ref:'Ottawa ankle rules; eTG Sport and exercise medicine.'},

{id:'gp-c9',t:'Melanoma – Pigmented Lesion',k:['Exam','Mx'],yr:'2013',
role:'You are a GP registrar.',
stem:'Peter Grant, 58, a farmer, asks you to look at a mole on his back that his wife thinks has changed.',
tasks:['Take a brief history of the lesion.','Perform a full skin examination and describe the lesion.','Explain your management to Peter.'],
script:{who:'Peter, 58. Fair skin, works outdoors.',open:'The wife reckons this mole\'s changed. I can\'t see it myself.',
act:'Down-to-earth; minimises.',
ask:['Mole noticed changing over 3 months: larger and darker.','Occasionally itchy, no bleeding.','Many sunburns as a child. No sunscreen until recently.','Brother had a melanoma removed.','Has never had a skin check.'],
raise:['Do I have cancer?','Will it need a big operation?'],
fx:['Left upper back: 9 × 7 mm asymmetrical lesion, irregular border, variegated brown/black/blue, slightly raised.','Dermoscopy: atypical network, blue-white veil.','Second lesion on right calf: 5 mm irregular pigmented macule (found only on full skin exam).','No palpable lymph nodes.']},
eq:[['How is melanoma excised?','Excisional biopsy with 2 mm margins for diagnosis (full thickness, not shave). Wide local excision margin then depends on Breslow thickness (e.g. 1 cm for ≤1 mm, 1–2 cm for >1–2 mm, 2 cm for >2 mm).']],
m:[['Introduces self, consent for exam with chaperone offered',1],['Lesion history: change, itch, bleeding',1],['Risk factors: sun exposure, sunburns, family history, skin type',2],['Performs full skin exam including scalp, soles, nails',2],['Describes lesion using ABCDE',2],['Uses dermoscopy',1],['Finds the second lesion',2],['Palpates regional lymph nodes',1],['Explains suspicion for melanoma honestly',2],['Excisional biopsy with 2 mm margins; histology guides further surgery',2],['Sun protection; regular skin checks; family members check',1],['Follow-up for results',1]],
ref:'Cancer Council Australia Melanoma guidelines.'},

{id:'gp-c10',t:'Primary Dysmenorrhoea',k:['Hx','Couns'],yr:'2014',
role:'You are a GP registrar.',
stem:'Isla Brown, 16, attends alone. She has painful periods that stop her going to school. Mefenamic acid (Ponstan) no longer works well enough. She would like to try "the pill".',
tasks:['Take a relevant history.','Discuss management options.','Counsel Isla about the combined oral contraceptive pill.'],
script:{who:'Isla, 16. Year 11 student.',open:'My periods are killing me. I miss two days of school every month.',
act:'Mature; worried you will tell her mum.',
ask:['Periods since age 12. Regular, 28-day cycle, 5 days.','Crampy lower abdominal pain starting day 1, lasts 2 days. Nausea.','Takes Ponstan once pain starts.','No pain with sex (has had sex twice, used condoms), no intermenstrual bleeding.','No migraine, no clotting history, non-smoker. BP normal.'],
raise:['Do you have to tell my mum?','Will the pill make me fat?']},
m:[['Introduces self; HEADSS psychosocial screen; confidentiality and its limits',2],['Menstrual history and pain characteristics',2],['Features of secondary dysmenorrhoea (dyspareunia, pelvic pain outside periods, irregular bleeding)',1],['Sexual history; STI and pregnancy risk',2],['COCP contraindications (migraine with aura, VTE, smoking)',1],['Advises taking NSAID 1–2 days before or at onset, regularly',1],['Non-drug: heat, exercise',1],['COCP: how it reduces pain; can be taken continuously',2],['How to take, missed pill rule, starting',1],['Side effects incl. VTE risk; weight gain not supported by evidence',1],['Condoms for STI protection; STI screen offered',1],['Mature minor assessment (Gillick competence)',1],['Review in 3 months; refer if no improvement (?endometriosis)',1]],
ref:'eTG Sexual and reproductive health; Jean Hailes; Family Planning Australia.'},

{id:'gp-c11',t:'COPD Exacerbation – Aboriginal Liaison Officer',k:'Mx',yr:'2015',
role:'You are a junior doctor at a regional hospital. The patient below is ready for discharge.',
stem:'Mr Jack Kennedy, 61, an Aboriginal man from a community 4 hours away, was admitted with an exacerbation of COPD. He also has type 2 diabetes. He is being discharged tomorrow. You need to telephone the Aboriginal Liaison Officer (ALO) to arrange his discharge and follow-up. The discharge summary is provided.',
tasks:['Telephone the ALO and give a concise summary of Mr Kennedy\'s admission.','Arrange a culturally safe discharge and follow-up plan.'],
script:{who:'ALO (Sharon), experienced, busy.',open:'Hi, Sharon speaking, ALO.',
act:'Helpful but needs clear, prioritised information.',
ask:['Mr Kennedy has no transport home.','Medications changed: new tiotropium, prednisolone 5 days remaining, new metformin dose.','He lives with his daughter. The community clinic has an Aboriginal Health Worker and visiting GP fortnightly.','He has not had the flu or pneumococcal vaccine.','Discharge summary: smoker 30/day; HbA1c 9.2%.'],
raise:['Does he understand his new medicines?','What follow-up does he need?']},
m:[['Introduces self, role, purpose of call (ISBAR)',2],['Concise situation and background',2],['Clear assessment and key issues',1],['Requests: transport, medication supply and explanation',2],['Arranges follow-up with community clinic/AHW and visiting GP',2],['Pulmonary rehab and smoking cessation support',1],['Diabetes follow-up (HbA1c, 715 health check)',1],['Vaccinations',1],['Respects patient\'s cultural needs and family involvement',2],['Closed-loop: confirms plan, checks ALO questions',2]],
ref:'COPD-X Plan (Lung Foundation Australia); ISBAR.'},

{id:'gp-c12',t:'Headache – Pituitary Tumour',k:['Hx','Exam'],yr:'2011',
role:'You are a GP registrar.',
stem:'Graham Shaw, 64, has had headaches for 2 months. They often wake him at night and are present when he wakes up.',
tasks:['Take a focused history.','Perform a focused cranial nerve examination (II, III, IV, VI) and brief endocrine examination.','Give your differential diagnosis and next steps.'],
script:{who:'Graham, 64.',open:'These headaches are getting me down. They\'re worst first thing in the morning.',
act:'Worried.',
ask:['Dull generalised headache, worse on waking and when coughing or bending.','Occasional dizziness.','Bumping into door frames on both sides.','Tired, cold, dry skin, coarse hair, constipation.','Reduced libido.','No weight change.'],
raise:['Is it a tumour?'],
fx:['Visual fields: bitemporal hemianopia.','Pupils, eye movements normal. Fundoscopy: no papilloedema.','Dry skin, slow-relaxing reflexes. No goitre.']},
eq:[['Which investigations would you order?','MRI pituitary; pituitary hormone panel (TSH, free T4, cortisol, LH/FSH, testosterone, prolactin, IGF-1); formal visual fields; UEC (sodium).']],
m:[['Introduces self',1],['Headache SOCRATES',1],['Raised ICP features: morning, waking, cough/strain',2],['Visual symptoms',1],['Endocrine symptoms: hypothyroid, hypogonadal, adrenal',2],['Exam: visual acuity, visual fields by confrontation',2],['Pupils, eye movements (III, IV, VI), fundoscopy',2],['Brief endocrine exam: thyroid signs, skin, hair',1],['DDx: pituitary macroadenoma, other intracranial mass',2],['Next steps: urgent MRI, hormone panel, refer endocrinology/neurosurgery',2],['Explains plan sensitively',1]],
ref:'eTG Endocrinology.'},

{id:'gp-e1',t:'Vestibular Examination – BPPV',k:'Exam',yr:'2012',
role:'You are a GP registrar.',
stem:'Helen Moore, 55, has had brief episodes of the room spinning for a week, especially when she rolls over in bed.',
tasks:['Perform an examination of the vestibular system and describe your findings.','State the diagnosis and management.'],
script:{who:'Helen, 55.',open:'The room spins when I turn over in bed.',
act:'Dislikes being moved quickly; warn her first.',
ask:['Episodes last under a minute.','No hearing loss, tinnitus, headache or weakness.'],
fx:['Romberg negative. Gait normal. Cranial nerves normal.','No spontaneous nystagmus. Head impulse test normal.','Dix-Hallpike to the right: after 5 s latency, torsional upbeating nystagmus toward the right ear, fatigues within 30 s, reproduces vertigo.','Dix-Hallpike left: negative.']},
eq:[['How do you treat right posterior canal BPPV?','Epley manoeuvre (canalith repositioning) to the right; can be repeated, and taught for home use (or Brandt-Daroff exercises). Vestibular suppressants are not recommended long-term.']],
m:[['Introduces self, explains exam, consent, warns about dizziness',2],['Checks neck/back problems before Dix-Hallpike',1],['Gait and Romberg test',2],['Cerebellar signs and cranial nerves (brief)',1],['Looks for spontaneous and gaze-evoked nystagmus',1],['Head impulse test',1],['Dix-Hallpike performed correctly both sides',3],['Describes nystagmus: latency, torsional, fatigable',2],['Diagnosis: right posterior canal BPPV',1],['Mx: Epley manoeuvre; explains benign nature, recurrence',2],['Red flags for central cause noted',1]],
ref:'eTG Neurology (Vertigo); HINTS exam.'},

{id:'gp-e2',t:'Acute Back Pain with Neurology',k:['Exam','Mx'],yr:'2016',
role:'You are a GP registrar.',
stem:'Daniel Ross, 42, has severe low back pain radiating down his left leg after lifting a heavy box 5 days ago.',
tasks:['Perform a focused examination of the back and lower limb neurology.','Explain the likely diagnosis and your management.'],
script:{who:'Daniel, 42. Removalist.',open:'It shoots right down the back of my leg to my little toe.',
act:'Moves stiffly; worried about losing work.',
ask:['No bladder or bowel change, no saddle numbness.','No fever, weight loss, cancer history.','Numb outer foot.'],
fx:['Reduced lumbar flexion. Paraspinal tenderness.','Straight leg raise positive on left at 40°.','Weak left plantarflexion (4/5), reduced left ankle jerk.','Reduced sensation lateral foot and sole (S1).','Saddle sensation normal. Peripheral pulses present.']},
eq:[['When would you image urgently?','Suspected cauda equina syndrome (urinary retention, saddle anaesthesia, faecal incontinence), progressive neurological deficit, or red flags for malignancy, infection or fracture. MRI is preferred.']],
m:[['Introduces self, consent, exposes appropriately',1],['Inspection and gait (heel and toe walking)',1],['Palpation and range of movement of lumbar spine',1],['Straight leg raise ± crossed SLR',2],['Power by myotome L2–S1',2],['Reflexes: knee, ankle, plantar',2],['Sensation by dermatome incl. saddle area',2],['Mentions PR/post-void residual if cauda equina suspected',1],['Diagnosis: L5/S1 disc prolapse with S1 radiculopathy',2],['Mx: stay active, analgesia, physio; most resolve in 6–12 weeks',2],['Red flags safety-net (cauda equina) clearly explained',2]],
ref:'eTG Rheumatology/Pain (Low back pain); Australian Commission Low Back Pain Clinical Care Standard.'},

{id:'gp-e3',t:'Peripheral Arterial Disease Examination',k:'Exam',yr:'2017',
role:'You are a GP registrar.',
stem:'Frank Edwards, 68, gets cramping pain in his right calf when he walks about 100 metres. It goes away after a few minutes of rest.',
tasks:['Perform a lower limb vascular examination.','Give your diagnosis and initial management.'],
script:{who:'Frank, 68. Smoker, diabetic.',open:'My calf cramps up walking to the letterbox and back.',
act:'Cooperative.',
fx:['Right leg: shiny hairless skin, cool foot, capillary refill 4 s.','Femoral pulses present bilaterally. Right popliteal, dorsalis pedis and posterior tibial absent. Left foot pulses weak.','Buerger\'s test: right foot pale at 30°, dependent rubor.','Ankle-brachial index right 0.6, left 0.85.','No ulcers.']},
eq:[['How do you interpret ABI?','>1.4: non-compressible vessels; 1.0–1.4: normal; 0.91–0.99: borderline; ≤0.9: PAD; <0.4: severe/critical ischaemia.']],
m:[['Introduces self, consent, exposes both legs',1],['Inspection: colour, hair, skin, ulcers (incl. between toes, heels)',2],['Temperature and capillary refill',1],['Palpates femoral, popliteal, DP, PT bilaterally',2],['Auscultates for femoral bruits / AAA',1],['Buerger\'s test',2],['ABI: states how measured and interprets',2],['Diagnosis: intermittent claudication from PAD',1],['Mx: smoking cessation, supervised exercise, statin, antiplatelet',3],['Optimise diabetes and BP; foot care',1],['Refer vascular if lifestyle-limiting or critical features',1]],
ref:'eTG Cardiovascular; ANZSVS.'},

{id:'gp-e4',t:'Shoulder Examination',k:['Hx','Exam'],yr:'2018, 2023',
role:'You are a GP registrar.',
stem:'Wendy Clarke, 53, has had right shoulder pain for 3 months. It is worse when reaching overhead and at night when she lies on that side.',
tasks:['Take a brief history.','Examine the shoulder.','Explain your findings and management. Does she need surgery?'],
script:{who:'Wendy, 53. Hairdresser.',open:'I can\'t lift my arm up to do people\'s hair anymore.',
act:'Wants a quick fix; asks about surgery.',
ask:['Right-handed. Gradual onset. No trauma.','Pain over lateral upper arm, worse lifting arm, night pain lying on it.','No neck pain, numbness, weakness.','Diabetes: no.'],
raise:['Do I need an operation?'],
fx:['No wasting. Painful arc 70–120° on abduction.','Full passive range including external rotation.','Hawkins-Kennedy and Neer positive. Empty can (Jobe) painful but strength 5/5.','Lift-off and external rotation strength normal. Neck exam normal.']},
eq:[['Which feature differentiates adhesive capsulitis?','Global restriction of active AND passive movement, especially loss of passive external rotation.']],
m:[['Introduces self, consent, exposes both shoulders',1],['Brief history: onset, night pain, function, neck symptoms',1],['Look: symmetry, wasting, scars',1],['Feel: AC joint, bicipital groove, joint line',1],['Move: active then passive ROM incl. external rotation',2],['Rotator cuff strength: supraspinatus, infraspinatus, subscapularis',2],['Impingement tests: Hawkins-Kennedy, Neer',2],['Examines cervical spine',1],['Diagnosis: subacromial pain syndrome / rotator cuff tendinopathy',2],['Mx: activity modification, physio (first line), analgesia, consider subacromial steroid injection',2],['Surgery not indicated now; refer if fails 3–6 months or full-thickness tear',1],['Ultrasound only if diagnostic doubt or not improving',1]],
ref:'eTG Rheumatology (Shoulder pain); RACGP.'},

{id:'gp-e5',t:'Diabetic Foot and Neuropathy',k:['Exam','Mx'],yr:'2016',
role:'You are a GP registrar.',
stem:'Rajesh Kumar, 59, has type 2 diabetes for 12 years. He reports numbness and burning pain in both feet, worse at night.',
tasks:['Perform a lower limb neurological and diabetic foot examination.','Explain your findings and management.'],
script:{who:'Rajesh, 59.',open:'My feet burn at night and feel like they\'re wrapped in cotton wool.',
act:'Cooperative.',
ask:['HbA1c last month 8.6%.','Walks barefoot at home.'],
fx:['Dry skin, callus under 1st metatarsal heads, no ulcers.','Reduced sensation to 10 g monofilament in stocking distribution.','Absent vibration at toes. Absent ankle reflexes. Proprioception reduced at toes.','Foot pulses present.']},

{id:'gp-e6',t:'C-Spine Assessment after Trauma',k:['Hx','Exam'],yr:'2017',

{id:'gp-e9',t:'COPD – Respiratory Examination',k:['Exam','Couns'],yr:'2011',

{id:'ah2-c1',t:'Snake Bite',k:'Mx',yr:'2012',
role:'You are the doctor on duty at a rural hospital in North Queensland.',
stem:'Darren Cole, 38, has walked into the emergency department 20 minutes after being bitten on the left ankle by a brown snake while clearing long grass. His mate has applied nothing to the leg.',
tasks:['Perform immediate assessment and first aid.','Outline your ongoing management, investigations and indications for antivenom.'],
script:{who:'Darren, 38.',open:'A big brown snake got me on the ankle. Am I going to die?',
act:'Panicky; wants to wash the bite.',
ask:['Bitten 20 minutes ago. Walked 200 m to the car.','Mild headache. No vomiting, collapse, bleeding.','No allergies. Never had antivenom.'],
raise:['Should I wash it?','Do I need the antidote straight away?'],
fx:['HR 92, BP 130/80, RR 16, GCS 15.','Two puncture marks, minimal swelling.','No ptosis, no bleeding from gums or cannula sites.','Initial bloods pending.']},
eq:[['What are the indications for antivenom?','Evidence of systemic envenomation: venom-induced consumption coagulopathy (abnormal INR/aPTT/fibrinogen, raised D-dimer), neurotoxicity, myotoxicity (raised CK), or collapse/seizure. A single vial of the appropriate monovalent (brown snake) or polyvalent antivenom is used. Snake venom detection kits do not decide whether antivenom is needed.']],

{id:'ah2-c2',t:'Genital Herpes',k:['Hx','Couns'],yr:'2013',

{id:'ah2-c3',t:'Pre-op Counselling – TURP on Warfarin',k:['Hx','Couns'],yr:'2014',
role:'You are a surgical resident in the pre-admission clinic.',
stem:'Bill Andrews, 74, is booked for a transurethral resection of the prostate (TURP) in 2 weeks. He takes warfarin.',

script:{who:'Bill, 74.',open:'They told me to come in to talk about my blood thinner.',

ask:['Warfarin for atrial fibrillation for 5 years. INR usually 2–3.','No previous stroke or TIA. Hypertension. Age 74. No diabetes, no heart failure.','No mechanical valve. No previous clots.','Other meds: perindopril, atorvastatin.','Good exercise tolerance, no chest pain.','Previous GA for hernia, no problems. No allergies.'],
raise:['Won\'t I have a stroke if I stop it?','When do I start it again?']},
eq:[['When is bridging anticoagulation needed?','For high thrombotic risk: mechanical mitral valve, recent VTE (<3 months), AF with recent stroke/TIA or very high CHA2DS2-VA. Most AF patients without these do not need bridging, and bridging increases bleeding risk.']],
m:[['Introduces self, explains purpose',1],['Indication for warfarin, INR control',2],['Assesses thrombotic risk: CHA2DS2-VA, valves, VTE history',2],['Anaesthetic history: cardiorespiratory status, previous anaesthetics, airway, allergies',2],['Full medication list',1],['Plan: stop warfarin 5 days before; INR check day before surgery',2],['No bridging needed (low risk) with rationale',2],['Restart warfarin post-op when haemostasis secure (usually 12–24 h) per urologist',1],['Explains why: TURP is high bleeding risk',1],['Pre-op bloods: FBC, UEC, INR, group and hold; ECG',1],['Written instructions; checks understanding',1]],

{id:'ah2-c4',t:'Needlestick Injury',k:['Hx','Mx'],yr:'2016',

{id:'ah2-c5',t:'IV Fluid Prescribing',k:'Mx',yr:'2017',

{id:'ah2-c7',t:'Surgical Site Infection',k:['Hx','Mx'],yr:'2020, 2022',

fx:['HR 118, BP 92/58, RR 22, sats 96% RA, GCS 15.','Jaundice, spider naevi, ascites.','Hb 82, plt 78, INR 1.8.']},

m:[['ABCDE; calls for help',1],['2 large-bore IVs, bloods (FBC, UEC, LFT, coags, group and crossmatch)',2],['Resuscitation: restrictive transfusion (target Hb ~70–80), avoid fluid overload',2],['Terlipressin for suspected variceal bleed',2],['IV ceftriaxone (prophylaxis in cirrhosis)',2],['Thiamine before glucose; alcohol withdrawal monitoring',1],['Considers PPI until endoscopy',1],['ISBAR referral to gastroenterology for urgent endoscopy (within 12 h)',2],['Clear, concise; requests specific action',1],['Considers ICU/airway protection if ongoing haematemesis',1]],
ref:'GESA; eTG Gastrointestinal (Variceal bleeding).'},

{id:'ah2-c14',t:'Splenic Laceration',k:'Mx',yr:'2019',
role:'You are the junior doctor in a regional emergency department.',
stem:'Ethan Ward, 20, was the driver in a car accident 40 minutes ago. He has left upper quadrant pain and left shoulder-tip pain.',
tasks:['Perform a primary survey and initial management.','Outline your definitive management.'],
script:{who:'Ethan, 20. Examiner provides findings.',open:'My stomach and left shoulder are killing me.',
act:'Increasingly drowsy if not resuscitated.',
fx:['A: talking. B: RR 24, sats 97%, chest clear, left lower rib tenderness.','C: HR 128, BP 88/54, CRT 4 s, cool peripheries.','D: GCS 15. E: LUQ tenderness and bruising (seatbelt sign).','eFAST: free fluid in splenorenal recess.','After 1 L: HR 120, BP 90/60 (transient response).']},
eq:[['When is non-operative management appropriate?','Haemodynamically stable patients without peritonitis, at a centre with CT, interventional radiology (angioembolisation) and surgery available.']],
m:[['Calls trauma team; C-spine precautions',1],['Structured primary survey ABCDE',2],['Oxygen, 2 large-bore IVs, bloods incl. crossmatch and VBG/lactate',2],['Recognises haemorrhagic shock (class III)',2],['Permissive hypotension; early blood products, activates massive transfusion protocol',2],['Tranexamic acid within 3 hours',1],['eFAST interpretation',1],['Transient responder → urgent laparotomy/splenectomy (or angioembolisation if stabilises)',2],['Contacts surgeons / arranges retrieval (RSQ)',1],['Analgesia; secondary survey later',1],['Post-splenectomy vaccines and antibiotic advice mentioned',1]],
ref:'EMST/ATLS; Qld trauma guidelines.'},

{id:'ah2-c15',t:'Post-op Bleed – Live Trauma',k:'Mx',yr:'2011',

act:'Pale. Vitals improve only after fluids are given.',
fx:['A: patent. B: RR 24, sats 95% RA.','C: HR 124, BP 86/50 (only measured if requested). Cool peripheries. Drain 1 L, still draining. Foot pulses present.','D: GCS 15, oriented. E: temp 36.0 °C.','After fluids: HR 104, BP 104/66.']},
m:[['Calls for help, introduces self, reassures patient',1],['Airway and breathing; oxygen',1],['Asks for/measures BP and HR; recognises shock',2],['Asks nurse to apply direct pressure to wound',1],['2 large-bore IVs; FBC, coags, crossmatch',2],['Fluid bolus then blood; O-neg available; FFP/platelets as needed',2],['Calls orthopaedic registrar/consultant',1],['Checks neurovascular status of limb',1],['Considers tranexamic acid; reviews anticoagulants',1],['Analgesia, antiemetic, warmth; IDC for fluid balance',1],['Continuous monitoring; reassesses after each intervention',2],['Clear closed-loop instructions to team',1]],
ref:'Clinical Excellence Queensland – recognising deteriorating patient; ANZSBT.'},

{id:'ah2-c16',t:'Chronic Ear Discharge – CSOM',k:['Hx','Couns'],yr:'2011',

{id:'ah2-e1',t:'Inguinal Hernia Examination',k:['Exam','Couns'],yr:'2015',

{id:'ah2-e2',t:'Small Bowel Obstruction',k:['Hx','Exam','Mx'],yr:'2014, 2018',

ask:['Colicky central pain 24 h. Green vomit x6.','Not passed wind for 12 hours. Bowels last opened yesterday.','Previous open appendicectomy.','No hernias noticed.'],

{id:'cah-c1',t:'Reduced Feeding – 3-Week-Old',k:['Hx','Mx'],yr:'2023',
role:'You are a junior doctor in the paediatric emergency department.',
stem:'Baby Leo, 3 weeks old, is brought in by his mother. He has been feeding less than half his usual amount for 24 hours and has had fewer wet nappies.',
tasks:['Take a focused history.','Interpret the vital signs and examination findings the examiner gives you.','Explain your investigations to the mother.'],
script:{who:'Mum, Jess, 26. First baby.',open:'He\'s just not interested in feeding, and he\'s so sleepy.',
act:'Worried; senses something is wrong.',
ask:['Born at 39 weeks, normal vaginal birth, birth weight 3.4 kg. Went home day 2.','Mum GBS positive, received 1 dose of antibiotics 2 hours before birth.','Breastfed every 3 h until yesterday; now 5-minute feeds, falls asleep.','2 wet nappies in 24 h (usually 6+).','Felt hot to touch this morning. No vomiting, diarrhoea, cough or rash.','No sick contacts.'],
raise:['Why do you need to put a needle in his back?','Can I keep feeding him?'],
fx:['T 38.4 °C, HR 186, RR 58, sats 97%, CRT 3 s.','Lethargic, mottled, reduced tone. Fontanelle full. No rash.','Weight 3.3 kg.']},
eq:[['What empirical antibiotics would you give?','For an infant under 1 month with suspected sepsis: IV benzylpenicillin (or amoxicillin) plus gentamicin; add cefotaxime if meningitis is suspected and consider aciclovir for possible HSV (RCH Sepsis/Febrile infant guidelines).']],
m:[['Introduces self, empathic',1],['Feeding history: volume, duration, frequency',2],['Output: wet nappies, stools',1],['Fever, lethargy, irritability, vomiting, breathing, rash, seizures',2],['Perinatal history: gestation, GBS status, IAP, maternal fever, HSV',2],['Interprets vitals as septic infant (fever, tachycardia, poor perfusion)',2],['Recognises baby needs immediate senior review and resuscitation',1],['Full septic screen: FBC, CRP, blood culture, glucose, urine (catheter/SPA), LP',2],['Explains each test in plain language, incl. lumbar puncture',2],['IV antibiotics started promptly (without delaying for LP if unwell)',2],['Admission; supports breastfeeding/expressing',1]],
ref:'RCH Clinical Practice Guidelines: Febrile infant; Sepsis.'},

{id:'cah-c2',t:'Faltering Growth – Growth Chart',k:['Hx','Exam'],yr:'2014',
role:'You are a GP registrar.',
stem:'Ruby, 9 months old, has been referred by the child health nurse for poor weight gain. Her measurements are provided and a blank WHO growth chart is in front of you.',
tasks:['Plot Ruby\'s weight, length and head circumference.','Interpret the growth chart.','Take a focused history from her father.'],
script:{who:'Dad, Sam.',open:'The nurse said she\'s not growing properly. We feed her heaps.',
act:'Defensive initially.',
ask:['Born term, 3.3 kg (50th centile).','Breastfed to 6 months, now formula 4 × 180 mL + some solids.','Loose, pale, smelly stools since starting cereals.','Irritable, bloated tummy.','Mum has coeliac disease.','No vomiting. Development on track.'],
raise:['Is it something we\'re doing wrong?'],
fx:['Weight: birth 50th; 4 mo 25th; 6 mo 10th; 9 mo below 3rd centile (6.6 kg).','Length 25th centile (stable).','Head circumference 50th centile.','Thin buttocks, distended abdomen.']},
m:[['Plots all three parameters accurately',3],['Interprets weight crossing two major centiles; length and head preserved',2],['Defines faltering growth',1],['Feeding history: type, volume, preparation of formula, solids',2],['Stool and GI symptoms',1],['Perinatal and developmental history',1],['Family history (coeliac)',1],['Psychosocial history non-judgementally',1],['DDx: coeliac disease (likely), inadequate intake, malabsorption, chronic illness',2],['Next steps: coeliac serology (tTG-IgA, total IgA), FBC, iron, refer paediatrician',2],['Reassures and supports father',1]],
ref:'RCH Clinical Practice Guidelines: Faltering growth.'},

{id:'cah-c3',t:'Irritable Infant – 4 Weeks Old',k:'Hx',yr:'2015',
role:'You are a junior doctor in the paediatric emergency department.',
stem:'Baby Mason, 4 weeks old, has been irritable and not feeding well for 2 days. His mother says he has had fewer wet nappies.',
tasks:['Take a focused history.','Give your differential diagnoses.','Outline your initial investigations.'],
script:{who:'Mum, Kristy.',open:'He just screams and won\'t settle, and he\'s barely drinking.',
act:'Exhausted.',
ask:['Irritable 2 days, high-pitched cry.','Feeding half usual. Vomited twice (milky, not green).','4 wet nappies/day, smell strong.','Temp 38.0 °C at home.','Born 38 weeks, no complications. GBS negative.','Mild runny nose in older sibling.'],
raise:['Is it just colic?']},
m:[['Introduces self',1],['Irritability: onset, cry, consolable',1],['Feeding and vomiting (bilious?)',2],['Urine output and smell',1],['Fever history and measurement',1],['Resp symptoms, rash, seizures, fontanelle',1],['Perinatal history',1],['Sick contacts',1],['DDx: UTI, meningitis, sepsis, bronchiolitis/URTI, pyloric stenosis, intussusception (less likely)',3],['Febrile infant <3 months needs septic workup',2],['Urine (catheter/SPA), blood culture, FBC, CRP; LP depending on risk',2],['Admission; antibiotics if unwell',1]],
ref:'RCH Clinical Practice Guidelines: Febrile infant; UTI.'},

{id:'cah-c4',t:'Non-Accidental Injury',k:['Hx','Mx'],yr:'2016, 2018, 2022',
role:'You are a junior doctor in the paediatric emergency department.',
stem:'Baby Jayden, 3 weeks old, has not been moving his right arm since this morning. An X-ray shows a mid-shaft fracture of the right humerus. His mother and her new partner are present.',
tasks:['Take a history from the mother.','Give your differential diagnosis.','Explain your management to the mother.'],
script:{who:'Mum, Brooke, 19. Partner, Kyle, present.',open:'He just stopped moving his arm. I don\'t know what happened.',
act:'Vague; story changes when asked twice. Partner interrupts.',
ask:['First said he "rolled off the change table", later says "maybe his arm got caught in the cot".','Noticed at 7 am; brought in at 4 pm.','Kyle was looking after him overnight.','Mum says Kyle "lashes out sometimes when he\'s stressed".','Born at term, normal delivery, no birth injury noted.','No family history of bone disease.'],
raise:['Are you saying I hurt my baby?','Can we go home tonight?'],
fx:['Unsettled baby. Small bruise on left cheek. Right arm swollen, painful to move.','X-ray: transverse mid-shaft humeral fracture.']},
eq:[['What is your legal obligation in Queensland?','Doctors are mandatory reporters: a reasonable suspicion that a child has suffered, or is at risk of suffering, significant harm caused by physical or sexual abuse must be reported to Child Safety.']],
m:[['Introduces self, non-judgemental',2],['Detailed history of mechanism and timing',2],['Identifies inconsistencies and delay in presentation',2],['Who was caring for baby; household members',1],['Social history: supports, DV, drugs/alcohol, previous child safety involvement',2],['Birth history, bone disease family history',1],['States that a non-mobile infant with fracture and bruising raises concern for NAI',2],['Investigations: skeletal survey, CT head, ophthalmology review, bloods (FBC, coags, bone profile, LFT/lipase)',2],['Admits baby for safety',1],['Involves senior, child protection unit; mandatory report to Child Safety',2],['Honest, calm explanation to mother',1]],
ref:'RCH Clinical Practice Guidelines: Child abuse; Qld Child Protection Act 1999.'},

{id:'cah-c5',t:'Coughing Child – Croup',k:['Hx','Mx'],yr:'2017',
role:'You are a junior doctor in the paediatric emergency department.',
stem:'Olivia, 2 years old, woke at midnight with a barking cough and noisy breathing. She has had a runny nose for 2 days.',
tasks:['Take a focused history.','Give your diagnosis and differentials.','Explain your management to her father.'],
script:{who:'Dad, Chris.',open:'She sounds like a seal and she\'s making a whistling noise.',
act:'Anxious.',
ask:['Barking cough, harsh noise breathing in when upset.','Low-grade fever. Runny nose 2 days.','Drinking OK. Not drooling. Can swallow.','No choking episode. No previous episodes.','Immunisations up to date. No asthma.'],
raise:['Does she need antibiotics?'],
fx:['T 37.9 °C, HR 130, RR 32, sats 97%.','Stridor only when crying. Mild suprasternal recession. Alert, pink.']},
m:[['Introduces self',1],['Cough and stridor characteristics; onset',2],['Coryzal prodrome, fever',1],['Red flags: drooling, toxic, unable to swallow (epiglottitis), sudden choking (foreign body)',2],['Immunisation status (Hib)',1],['Diagnosis: mild croup (viral laryngotracheobronchitis)',2],['DDx: foreign body, epiglottitis, bacterial tracheitis, anaphylaxis',1],['Oral dexamethasone (0.15 mg/kg) or prednisolone',2],['Keep calm, avoid distressing her; no antibiotics',1],['Observation; adrenaline nebuliser if severe',1],['Safety-net: return if stridor at rest, working hard, colour change, drowsy',2]],
ref:'RCH Clinical Practice Guidelines: Croup.'},

{id:'cah-c6',t:'Acute Rheumatic Fever',k:'Couns',yr:'2019',
role:'You are a junior doctor on the paediatric ward in a regional hospital.',
stem:'Tahlia, 7, a Torres Strait Islander girl, has been diagnosed with acute rheumatic fever (ARF) after presenting with painful swollen joints and fever. Echocardiogram shows mild mitral regurgitation. Her mother asks what this means.',
tasks:['Explain what ARF is and its cause.','Explain the features and why the heart matters.','Explain management, including long-term injections.'],
script:{who:'Mum, Lena.',open:'The doctors said it\'s rheumatic fever. What is that?',
act:'Concerned about needles; Tahlia hates them.',
ask:['Sore throat a few weeks ago, not treated.','Family of 7 in a 3-bedroom house.','Tahlia\'s cousin has "heart problems from rheumatic fever".'],
raise:['How long does she need needles?','Can it come back?']},
eq:[['What is secondary prophylaxis in ARF?','Benzathine benzylpenicillin G IM every 28 days (21 days in some high-risk cases) for a minimum of 10 years after the last episode or until age 21, longer with moderate/severe RHD.']],
m:[['Introduces self, culturally safe, checks understanding',2],['Explains ARF: immune reaction after strep A throat/skin infection',2],['Explains features: joints, heart, skin, chorea',1],['Explains RHD: damage to heart valves, can worsen with repeat ARF',2],['Acute treatment: penicillin to clear strep, aspirin/naproxen for joints, rest',1],['Secondary prophylaxis: benzathine penicillin every 28 days, duration',2],['Pain reduction strategies for injections (lignocaine, ice, distraction)',1],['Regular echo and dental care',1],['Prevention: treat sore throats and skin sores, housing',1],['Register on RHD register; AHW involvement',1],['Checks understanding; written resources (RHDAustralia)',1]],
ref:'RHDAustralia 2020 Australian guideline for prevention, diagnosis and management of ARF and RHD.'},

{id:'cah-c7',t:'Impetigo – Phone Consult with Mother',k:['Hx','Couns'],yr:'2020',
role:'You are a GP registrar. You are phoning a mother in a remote community.',
stem:'Jacob, 6, an Aboriginal boy, has crusted sores around his lips and on his legs. This is his third episode this year. The Aboriginal Health Worker has asked you to speak to his mother by phone.',
tasks:['Take a focused history.','Explain the diagnosis.','Give instructions for treatment and prevention.'],
script:{who:'Mum, Rose.',open:'He\'s got these yellow crusty sores again.',
act:'Quiet; responds well to respectful questions.',
ask:['Sores around lips and both legs, 5 days, honey-coloured crusts.','Itchy. Other kids at home have scabies.','No fever. Eating and drinking.','No swelling of face, dark urine or swollen legs.','No penicillin allergy.'],
raise:['Does he have to stay home from school?']},
m:[['Introduces self, culturally safe, uses plain language',2],['Lesion history: site, number, duration',1],['Systemic features',1],['Scabies and household contacts',1],['Asks for post-strep complications (haematuria, oedema, joint pain)',1],['Explains impetigo: bacterial skin infection, contagious',2],['Treatment: oral co-trimoxazole for 3–5 days or single IM benzathine penicillin (remote Aboriginal communities)',2],['Wash and cover sores, cut nails, wash clothes and linen',2],['Treat scabies in whole household (permethrin)',2],['School exclusion until 24 h after antibiotics started; sores covered',1],['Follow-up via AHW; return if worse',1]],
ref:'National Healthy Skin Guideline (2018); RCH Impetigo; CARPA.'},

{id:'cah-c8',t:'New Diagnosis of Type 1 Diabetes',k:['Hx','Couns'],yr:'2012',
role:'You are a junior doctor on the paediatric ward.',
stem:'Noah, 10, was admitted yesterday with thirst, weight loss and a blood glucose of 24 mmol/L. He did not have diabetic ketoacidosis. His father is here.',
tasks:['Take a brief history.','Explain the diagnosis of type 1 diabetes.','Outline the management plan.'],
script:{who:'Dad, Michael.',open:'So does this mean he\'ll need needles forever?',
act:'Shocked; blames himself for letting Noah drink soft drink.',
ask:['3 weeks of thirst, frequent urination, bedwetting, 3 kg weight loss.','Tired. No vomiting or abdominal pain.','Grandmother has hypothyroidism.'],
raise:['Did I cause this by giving him lollies?','Can he still play football?']},
m:[['Introduces self, empathy',1],['Brief history of symptoms',1],['Asks about DKA features and family history',1],['Explains T1DM: autoimmune, pancreas stops making insulin',2],['Reassures: not caused by diet',2],['Lifelong insulin: injections or pump',2],['Glucose monitoring (CGM/fingerprick)',1],['Hypoglycaemia recognition and treatment',2],['Sick day management and DKA warning signs',1],['Diabetes educator, dietitian, school plan, NDSS registration',1],['Can still play sport with planning',1],['Checks understanding, support',1]],

{id:'cah-c9',t:'Febrile Infant – Sepsis',k:['Hx','Mx'],yr:'2013',
role:'You are a junior doctor in a regional emergency department.',
stem:'Isabella, 6 months old, has had a fever for 1 day. She has become drowsy and is not feeding.',
tasks:['Take a focused history.','Give your differential diagnosis.','Outline investigations and management and answer the parents\' questions.'],
script:{who:'Mum, Lauren.',open:'She\'s burning up and she\'s so floppy.',
act:'Very anxious.',
ask:['Fever 39.6 °C. Drowsy, floppy since this afternoon.','Half usual feeds. 1 wet nappy today.','Spots on legs appeared an hour ago.','Vomited twice.','Immunisations: missed 4-month vaccines.'],

fx:['T 39.4 °C, HR 190, RR 50, CRT 4 s, BP 70/40.','Drowsy, mottled. Non-blanching petechial rash on legs.']},
m:[['Introduces self',1],['Fever history, behaviour, feeding, output',2],['Rash characteristics',1],['Immunisation status',1],['Recognises septic shock with possible meningococcal disease',2],['Calls for senior help immediately',1],['IV/IO access, cultures, glucose, VBG',1],['IV ceftriaxone without delay',2],['Fluid bolus 10–20 mL/kg, reassess',2],['Admission, consider PICU/retrieval',1],['Explains seriousness honestly; why she cannot go home',2],['Public health notification and contact prophylaxis',1]],

{id:'cah-c10',t:'Febrile Seizure – Discharge Counselling',k:'Couns',yr:'2012, 2014, 2018, 2020',
role:'You are a junior doctor in a regional emergency department.',
stem:'Lily, 3, was brought in by ambulance this morning after a seizure at home. She has a viral upper respiratory tract infection; her temperature was 39.2 °C on arrival. She has been observed for 4 hours and is now alert, playing and drinking. The registrar has cleared her for discharge. Her mother, Sarah, is with her.',
tasks:['Explain to Sarah what has happened to Lily.','Address her concerns.','Give discharge advice, including what to do if it happens again.'],
eq:[['Which features would make this a complex febrile seizure?','Focal onset, lasting more than 15 minutes, recurrence within 24 hours or the same illness, or incomplete recovery within 1 hour. These need further assessment, for example for meningitis or encephalitis.'],['What is Lily\'s risk of having another one?','About 30%. Higher with a family history, first seizure under 12–18 months, lower temperature at the time of seizure, or short fever duration before the seizure. No EEG or imaging is needed after a simple febrile seizure.']],
script:{who:'Sarah, 30s. Frightened and teary.',open:'Is she going to be okay? I thought she was dying. Does this mean she has epilepsy?',
act:'Teary at first; calms with clear explanation.',
ask:['Seizure lasted about 2 minutes. Whole body stiffened then jerked; eyes rolled back.','Sleepy for about 30 minutes afterwards, then back to normal.','Runny nose for 2 days.','No past medical history. Immunisations up to date.','Lily\'s dad had "fits with fevers" as a toddler.'],
raise:['Should I give her Panadol around the clock to stop it happening again?','Should I put something in her mouth so she doesn\'t bite her tongue?']},
m:[['Introduces self, confirms patient and mother, establishes what mum understands',2],['Acknowledges how frightening this was',1],['Explains febrile seizure: fit triggered by fever in young children, common (~3 in 100), 6 months to 6 years',2],['Reassures: no brain damage, not epilepsy; risk of later epilepsy only slightly higher',2],['Recurrence risk ~1 in 3, higher with family history or young age at first seizure',2],['Paracetamol/ibuprofen for comfort only; does not prevent seizures',2],['First aid: stay calm, time it, lie on side on safe surface, nothing in mouth',2],['Call 000 if >5 minutes, breathing difficulty, or not waking afterwards',2],['Safety-net: drowsy/floppy, stiff neck, rash, poor feeding; GP review in 1–2 days',2],['Checks understanding, invites questions, offers RCH Kids Health Info fact sheet',1]],
ref:'RCH Clinical Practice Guidelines: Febrile seizures.'},

{id:'cah-c11',t:'Infectious Mononucleosis (EBV)',k:['Hx','Couns'],yr:'2016',
role:'You are a GP registrar.',
stem:'Ava Ross, 16, has had a sore throat, fever and tiredness for 10 days. Her monospot test is positive.',

script:{who:'Ava, 16, with mum.',open:'I\'m so tired I can barely get out of bed.',
act:'Wants to know when she can play netball (state team).',

m:[['Introduces self, engages adolescent directly; HEADSS / confidentiality',2],['Symptom history and duration',1],['Rash after amoxicillin',1],['Abdominal pain (splenic rupture)',1],['Contact history',1],['DDx: EBV, CMV, strep throat, acute HIV, toxoplasmosis',2],['Explains glandular fever: viral, self-limiting',1],['Supportive: rest, fluids, analgesia; antibiotics not helpful',2],['Avoid contact sport for at least 4 weeks (splenic rupture), longer if spleen enlarged',2],['Explains amoxicillin rash is not true allergy',1],['Fatigue may last weeks; graded return to school',1],['Safety-net: LUQ pain, breathing/swallowing difficulty',1]],

{id:'cah-c12',t:'Childhood Obesity',k:['Hx','Couns'],yr:'2017',

stem:'Ethan, 9, is brought in by his mother, who is worried about his weight. His BMI is above the 97th centile.',
tasks:['Take a history, including screening for secondary causes.','Give lifestyle advice in a non-judgemental way.'],
script:{who:'Mum, Natalie. Ethan present.',open:'Everyone at school calls him names. I don\'t know what to do.',
act:'Ethan is quiet and embarrassed.',
ask:['Weight increasing over 3 years. Height on 75th centile and growing normally.','Drinks 2 cans of soft drink daily. 3 h screen time.','Snores loudly. Tired at school.','Development normal. No vision problems, not always hungry.','Family history: dad has type 2 diabetes.'],
raise:['Could it be his glands?']},
m:[['Introduces self, talks to child directly, sensitive language',2],['Diet, drinks, meal patterns',1],['Physical activity and screen time',1],['Sleep, snoring (OSA)',1],['Secondary causes: short stature/slow growth (endocrine), dysmorphic features, developmental delay, hyperphagia (genetic)',2],['Psychosocial: bullying, mood',1],['Family history: diabetes, CVD',1],['Explains normal height velocity makes endocrine cause unlikely',1],['Family-based lifestyle approach with SMART goals',2],['Water instead of sugary drinks; screen limits; 60 min activity daily',1],['Investigations: BP, fasting lipids, glucose/HbA1c, LFT (NAFLD); sleep study',1],['Follow-up and referral (dietitian, paediatric clinic)',1]],

{id:'cah-c13',t:'Functional Constipation',k:'Hx',yr:'2019',
role:'You are a GP registrar.',
stem:'Harper, 4, has been "constipated for months", according to her father. She has been soiling her underwear.',
tasks:['Take a focused history.','State the diagnosis and differential diagnoses.','Outline management.'],
script:{who:'Dad, Tom.',open:'She\'s pooing in her pants and I\'m at my wits\' end.',
act:'Frustrated with Harper.',
ask:['Hard, large stools every 5 days; painful; blocks the toilet.','Soiling of underwear daily.','Hides and crosses her legs (withholding).','Started after toilet training at 3; new sibling.','Passed meconium day 1. No vomiting, weight loss, abdominal distension.','Drinks mainly milk (1 L/day). Picky eater.'],

m:[['Introduces self',1],['Stool frequency, consistency (Bristol), pain',2],['Withholding, soiling',1],['Onset and triggers (toilet training, stressors)',1],['Red flags: delayed meconium, failure to thrive, distension, vomiting, neuro symptoms, blood',2],['Diet and milk intake',1],['Diagnosis: functional constipation with overflow',2],['DDx: Hirschsprung, hypothyroidism, coeliac, spinal problems',1],['Explains soiling is not deliberate',2],['Disimpaction then maintenance with macrogol (e.g. Movicol)',2],['Toilet sitting routine, rewards, reduce milk, fibre/fluids',1],['Long-term treatment; follow-up',1]],
ref:'RCH Clinical Practice Guidelines: Constipation.'},

{id:'cah-c14',t:'Bronchiolitis',k:['Hx','Couns'],yr:'2021',

m:[['Introduces self',1],['Symptom timeline',1],['Feeding and hydration',2],['Apnoea, cyanosis, lethargy',1],['Risk factors: prematurity, age <10 weeks, CHD, chronic lung disease, smoke',2],['DDx: bronchiolitis, pneumonia, pertussis, heart failure',1],['Explains bronchiolitis: viral, peaks day 2–3, cough lasts weeks',2],['No role for salbutamol, steroids or antibiotics',2],['Supportive: small frequent feeds, NG feeds if needed; oxygen if sats <90–92%',1],['Admission vs discharge criteria explained',1],['Safety-net: working harder, poor feeding, pauses',2]],
ref:'RCH Clinical Practice Guidelines: Bronchiolitis; PREDICT guideline.'},

{id:'cah-c15',t:'Childhood Asthma – Discharge Plan',k:['Hx','Couns'],yr:'2011',

{id:'cah-e2',t:'Post-discharge Respiratory Review',k:['Hx','Exam'],yr:'2015',

{id:'cah-e4',t:'Heart Murmur in a Child',k:['Hx','Exam','Couns'],yr:'2011',
role:'You are a GP registrar.',
stem:'Lucas, 10, was found to have a heart murmur by the school nurse during a routine check last week, when he had a cold and fever.',

]);

{id:'mh-c1',t:'Suicide Risk Assessment',k:['Hx','Mx'],yr:'2012–2021 (×6)',
role:'You are a junior doctor in the emergency department.',
stem:'Daniel Hart, 24, was brought in by police after he cut his wrist with a bread knife following a relationship breakup last night. His wound has been sutured and he is medically cleared.',
tasks:['Perform a suicide risk assessment.','Decide whether Daniel can be managed in the community or needs admission, and explain your plan to him.'],
script:{who:'Daniel, 24. Labourer.',open:'I\'m fine now. Can I just go home?',
act:'Flat, avoids eye contact. Opens up if treated with warmth and given time.',
ask:['Girlfriend of 3 years left last night. Drank 10 beers, cut wrist in the kitchen.','Did it to "make the pain stop"; did not leave a note; housemate found him.','Still thinks about dying "a bit" but no plan now. Regrets housemate finding him? "Kind of."','Low mood for 2 months: poor sleep, lost interest in fishing, poor appetite.','Previous overdose at 19.','Drinks heavily on weekends, cannabis daily.','Lives with housemate; parents in Brisbane; close to his sister.','Owns no firearms. Has a box of paracetamol at home.'],
raise:['Are you going to lock me up?']},
eq:[['What makes this presentation higher risk?','Male, previous attempt, ongoing suicidal ideation, depressive symptoms, alcohol and cannabis use, recent loss, impulsivity with intoxication, ambivalence about being found.']],
m:[['Introduces self, privacy, confidentiality and its limits',2],['Builds rapport, non-judgemental',1],['Details of the event: planning, intent, lethality, alone, note, discovery, regret',3],['Current suicidal ideation, plans, intent',2],['Depressive and psychotic symptoms screen',1],['Past attempts and psychiatric history',1],['Substance use',1],['Protective factors: supports, reasons for living',1],['Access to means; plan to restrict',1],['Summarises risk (high) and formulates plan',2],['Involves mental health team; considers admission (voluntary first)',2],['Safety plan, involve family with consent, crisis numbers (Lifeline 13 11 14)',2]],
ref:'Qld Health Suicide risk assessment and management; Mental Health Act 2016 (Qld).'},

{id:'mh-c2',t:'Alcohol Withdrawal',k:['Hx','Mx'],yr:'2013, 2020, 2022, 2023',
role:'You are a junior doctor on the medical ward.',
stem:'Greg Fisher, 52, was admitted 2 days ago for cellulitis. The nurse is worried because he is sweaty, shaky and agitated.',
tasks:['Take a focused alcohol history.','Explain your management of his withdrawal.','Answer two examiner questions.'],
script:{who:'Greg, 52.',open:'I need to get out of here. There are bugs on the wall.',
act:'Tremulous, sweaty, restless.',
ask:['Drinks 1 bottle of wine and 6 beers a day for 10 years.','Last drink 48 hours ago (admission).','Morning tremor relieved by drinking.','Previous withdrawal seizure 2 years ago.','Tried to cut down before, failed. Lost driver\'s licence.','Liver "a bit off" according to GP.'],
raise:['Can I have a drink to calm down?'],
fx:['HR 112, BP 156/92, T 37.8 °C. Tremor, sweating, visual hallucinations.','Alcohol Withdrawal Scale: 15.']},
eq:[['Why give thiamine before glucose?','Glucose metabolism uses thiamine and can precipitate Wernicke encephalopathy (confusion, ataxia, ophthalmoplegia) in thiamine-deficient patients. Give IV thiamine (e.g. 300 mg) before glucose.'],['Name two medications that help maintain abstinence.','Acamprosate, naltrexone (avoid in liver failure or opioid use), disulfiram.']],
m:[['Introduces self, calm approach',1],['Quantity, type, pattern (standard drinks)',2],['Time of last drink',1],['Dependence features: tolerance, withdrawal, cravings, failed attempts, consequences',2],['Previous withdrawal seizures or DTs',2],['Other substances, physical complications',1],['Recognises moderate–severe withdrawal',1],['Benzodiazepine loading/symptom-triggered diazepam per withdrawal scale',2],['IV thiamine before glucose; electrolytes (Mg, phosphate, K)',2],['Safe environment, fluids, monitoring',1],['Discusses future treatment: relapse prevention, AOD services',1],['Answers examiner questions correctly',2]],
ref:'Qld Health Alcohol withdrawal management; Australian Guidelines for the Treatment of Alcohol Problems (2021).'},

{id:'mh-c3',t:'SSRI Counselling – Sertraline',k:'Couns',yr:'2015, 2020',
role:'You are a GP registrar.',
stem:'Ryan Cooper, 22, was diagnosed with moderate depression. His psychiatrist has started him on sertraline 50 mg daily. He has questions before he starts.',
tasks:['Counsel Ryan about sertraline: how to take it, expected effects, side effects and interactions.','Answer his questions.'],
script:{who:'Ryan, 22. University student.',open:'I\'m a bit worried about taking these. Will they change my personality?',
act:'Anxious; asks about drinking at the weekend.',
ask:['Seeing a psychologist fortnightly.','Drinks on weekends. Uses MDMA occasionally at festivals.','On no other medications. Takes St John\'s wort "sometimes".','No suicidal thoughts currently.'],
raise:['How long until it works?','Can I drink on it?','Will it affect sex?']},
m:[['Introduces self, explores concerns',1],['How to take: once daily, same time, with food if nausea',1],['Onset: 2–6 weeks; continue for 6–12 months after recovery',2],['Common side effects: nausea, headache, sleep change, sexual dysfunction',2],['Early increase in anxiety/agitation; monitor suicidal thoughts in young people',2],['Interactions: serotonin syndrome with MDMA, St John\'s wort, tramadol',2],['Alcohol: reduce/avoid',1],['Not addictive; do not stop abruptly (discontinuation symptoms)',2],['Will not change personality',1],['Continue psychological therapy',1],['Safety-net and review in 2 weeks',1]],
ref:'eTG Psychotropic; RANZCP Mood disorders guideline.'},

{id:'mh-c4',t:'Anorexia Nervosa – Blood Results',k:'Couns',yr:'2012, 2016',

{id:'mh-c5',t:'Anxiety – Palpitations',k:'Hx',yr:'2017, 2018, 2022',
role:'You are a GP registrar.',
stem:'Matt Gibson, 34, has had episodes of palpitations and chest tightness for 8 months. His cardiologist has investigated him extensively and found no cardiac cause.',

{id:'mh-c6',t:'Clozapine Review',k:['Hx','Mx'],yr:'2019',
role:'You are a junior doctor in a community mental health clinic.',
stem:'Liam Burke, 35, has schizophrenia and has been well on clozapine for 3 years. He reports his voices have come back over the last month. He says he takes his medicine every day. His recent blood results are provided.',
tasks:['Take a focused history.','Interpret the investigations.','Outline your management.'],
script:{who:'Liam, 35.',open:'The voices are back telling me I\'m worthless. I take my tablets, I promise.',
act:'Mildly distracted; honest.',
ask:['Takes clozapine 400 mg every night, uses a Webster pack.','Started smoking again 6 weeks ago (was quit 1 year).','Voices commenting, not commanding. No thoughts of harm to self or others.','Constipated, bowels every 4 days.','No chest pain, fever or shortness of breath.'],
raise:['Are you going to change my medicine?'],
fx:['FBC: WCC 6.2, neutrophils 3.8 (normal).','Clozapine level: 180 µg/L (previously 420 µg/L).','Troponin and CRP normal.']},
eq:[['Why did his clozapine level drop?','Smoking induces CYP1A2, which increases clozapine metabolism. Restarting smoking can lower levels by up to 50%; stopping smoking raises levels and risks toxicity.']],
m:[['Introduces self',1],['Explores psychotic symptoms: voices, content, command',2],['Risk assessment: self and others',2],['Adherence explored respectfully',1],['Asks about smoking change and other medicines',2],['Clozapine side effects: constipation, sedation, hypersalivation, myocarditis symptoms',2],['Interprets FBC as normal; level subtherapeutic',2],['Links low level to smoking',2],['Mx: discuss with psychiatrist re dose adjustment; repeat level',1],['Treat constipation (bowel regimen) — risk of ileus',1],['Smoking cessation support with dose monitoring',1]],
ref:'Qld Health Clozapine guidelines; eTG Psychotropic.'},

 sure. I was hoping you could help me work it out.” Do not name the underlying diagnosis.","Main worry | If asked what worries you most: “I am worried that this might be something serious, or that it could get worse.”","What they want today | If asked what you hope to get from the visit: “An explanation, and to know what should happen next.”","Symptom chronology | If asked when symptoms began or what happened first, repeat the onset and time course given in the case notes. Do not change the timeline or invent additional episodes.","Severity and function | If asked whether the symptom stops you functioning, answer using the documented severity and its effect on normal activities; where the station gives no severity, say “It is bothering me enough that I wanted to get checked.”","Treatments already tried | If asked about treatment tried so far, first disclose any treatments documented above. If none is specified, say “I have not tried any specific treatment for this yet.”","Other symptoms | For each symptom the student asks about, use the positives or negatives explicitly stated in the presenting history. For an unlisted symptom, say “No, I have not noticed that,” unless this contradicts another case detail.","Past illnesses | If asked about major medical conditions, tell the student about every condition documented in the case. If no other condition is stated, answer “Nothing else that I have been diagnosed with.”","Previous operations or hospital admissions | Disclose any procedures, admissions or complications documented for this patient. If the scenario gives none, answer “I have not had any other operations or hospital stays.”","Regular medications | Name all medications explicitly mentioned in the scenario, with doses when supplied. If none are described, say “I do not take any regular prescribed tablets.”","Recent medicines and nonprescription products | Disclose medication changes, analgesia, inhalers or supplements mentioned in the case. If none are described | If asked about major medical conditions, tell the student about every condition documented in the case. If no other condition is stated, answer “Nothing else that I have been diagnosed with.”","Previous operations or hospital admissions | Disclose any procedures, admissions or complications documented for this patient. If the scenario gives none, answer “I have not had any other operations or hospital stays.”","Regular medications | Name all medications explicitly mentioned in the scenario, with doses when supplied. If none are described, say “I do not take any regular prescribed tablets.”","Recent medicines and nonprescription products | Disclose medication changes, analgesia, inhalers or supplements mentioned in the case. If none are described, say “Nothing else, including over the counter tablets or herbal products.”","Medication allergies | If an allergy is specified above, give that answer and describe the reaction. Otherwise say “I do not know of any medication allergies.”","Family history | Mention familial conditions and inherited risks already described. If no additional history is recorded, say “I do not know of a close relative with the same problem.”","Smoking and vaping | Unless smoking or vaping is already stated in the case, say “I do not smoke or vape.”","Alcohol and recreational drugs | Use the documented alcohol or drug history where provided. Otherwise say “I do not take recreational drugs, and I do not drink much alcohol.”","Home and support | State any family, living arrangements and support mentioned above. If these are not specified, say “I have someone I can call if I need help.”","Work or study | If the case describes an occupation or school circumstances, use that description. Otherwise say “I can generally manage my normal day, although this issue is worrying me.”","Safety and emergency symptoms | If asked about serious symptoms that are expressly documented, give the stated answer. Do not volunteer an additional emergency symptom or contradiction; if no such symptoms are recorded, say “Nothing else alarming that I have noticed.”","Closing question | Near the end, if invited to ask questions, say “What do you think is going on, what happens next, and when should I get help urgently?”","Who is giving the history | You are the parent or caregiver unless the stem says otherwise. Use “my child” and speak in everyday words. Let older children answer age appropriate questions where possible.","Pregnancy and birth | Unless the case notes specify otherwise, say: “The pregnancy was straightforward, my baby was born around their due date, and there were no major problems during delivery.” Do not invent an exact birthweight or delivery method.","Neonatal course | If asked about special care or time in hospital after birth, say “No special care nursery, significant jaundice, or newborn breathing problems,” unless documented otherwise.","Feeding | For infants, report the feeding and wet nappies in the case notes; otherwise say “They are usually feeding as normal for them.” For older children, discuss appetite, drinks and eating pattern as appropriate.","Growth | Use documented weights, growth chart data and changes in appetite. If no growth concern is described, say “At previous checks we were told growth was tracking okay.”","Gross motor milestones | If development is relevant and no delay is documented, say “They have been sitting, walking and running at about the expected ages for them,” adjusting to the actual child’s age.","Fine motor milestones | If no delay is noted, say “They can use their hands and play with objects in a way that seems appropriate for their age.” Do not claim milestones that are not age appropriate.","Language and social milestones | If no delay is documented, say “They communicate, interact and play appropriately for their age; nobody has raised a developmental concern.”","Immunisation | If the case gives no contrary detail, say “They are up to date with their Australian childhood vaccines as far as I know.” Do not guess particular doses or dates.","Previous health and hospital admissions | Describe every documented condition and admission. If none are specified, say “No other major health problems or hospital stays.”","Child’s medicines and allergies | Name documented medicines, including dosing if stated. Otherwise say “No regular medicines and no known medicine allergies.”","Family and household | Mention any documented family risks or household exposure; otherwise say “Nobody else at home is having quite the same problem.”","Childcare or school | If age appropriate, say “They attend childcare or school and things are usually going okay,” unless the scenario says otherwise.","Hydration and elimination | For infants and acutely unwell children, answer with documented wet nappies, urine, stools, vomiting and feeding changes. Where undocumented, say “I have not noticed any other change.”","Parent’s concern and expectations | If asked say “I am most worried something important might be missed. Can you explain what to watch for and what I should do next?”"],"volunteerGuide":"Read the original patient details and the original “give only if asked” answers first. Those always take priority over the standard responses below. Say the opening line naturally, then wait for questions. Never read out every answer at once. Do not announce the diagnosis. You can repeat, clarify or use plain words, but do not make up contradictory symptoms, timings, medical conditions, medicines or examination findings. If you genuinely cannot find an answer, say “I am not sure” and ask the examiner for clarification. Counselling, examination and emergency management stations may use less history than history stations; use the time to engage with the appropriate task.","extraMarks":[["Uses a logical, focused sequence and clarifies the symptom chronology, severity and functional impact",1],["Elicits relevant associated symptoms and important negatives without leading questions
