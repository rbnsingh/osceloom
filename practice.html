onatal course | If asked about special care or time in hospital after birth, say “No special care nursery, significant jaundice, or newborn breathing problems,” unless documented otherwise.","Feeding | For infants, report the feeding and wet nappies in the case notes; otherwise say “They are usually feeding as normal for them.” For older children, discuss appetite, drinks and eating pattern as appropriate.","Growth | Use documented weights, growth chart data and changes in appetite. If no growth concern is described, say “At previous checks we were told growth was tracking okay.”","Gross motor milestones | If development is relevant and no delay is documented, say “They have been sitting, walking and running at about the expected ages for them,” adjusting to the actual child’s age.","Fine motor milestones | If no delay is noted, say “They can use their hands and play with objects in a way that seems appropriate for their age.” Do not claim milestones that are not age appropriate.","Language and social milestones | If no delay is documented, say “They communicate, interact and play appropriately for their age; nobody has raised a developmental concern.”","Immunisation | If the case gives no contrary detail, say “They are up to date with their Australian childhood vaccines as far as I know.” Do not guess particular doses or dates.","Previous health and hospital admissions | Describe every documented condition and admission. If none are specified, say “No other major health problems or hospital stays.”","Child’s medicines and allergies | Name documented medicines, including dosing if stated. Otherwise say “No regular medicines and no known medicine allergies.”","Family and household | Mention any documented family risks or household exposure; otherwise say “Nobody else at home is having quite the same problem.”","Childcare or school | If age appropriate, say “They attend childcare or school and things are usually going okay,” unless the scenario says otherwise.","Hydration and elimination | For infants and acutely unwell children, answer with documented wet nappies, urine, stools, vomiting and feeding changes. Where undocumented, say “I have not noticed any other change.”","Parent’s concern and expectations | If asked say “I am most worried something important might be missed. Can you explain what to watch for and what I should do next?”"],"volunteerGuide":"Read the original patient details and the original “give only if asked” answers first. Those always take priority over the standard responses below. Say the opening line naturally, then wait for questions. Never read out every answer at once. Do not announce the diagnosis. You can repeat, clarify or use plain words, but do not make up contradictory symptoms, timings, medical conditions, medicines or examination findings. If you genuinely cannot find an answer, say “I am not sure” and ask the examiner for clarification. Counselling, examination and emergency management stations may use less history than history stations; use the time to engage with the appropriate task.","extraMarks":[["Uses a logical, focused sequence and clarifies the symptom chronology, severity and functional impact",1],["Elicits relevant associated symptoms and important negatives without leading questions",1],["Explores pertinent past history, procedures and previous healthcare encounters",1],["Checks all relevant medicines, adherence, recent treatment and medication allergies",1],["Elicits relevant family, lifestyle, living situation and support history",1],["Elicits ideas, concerns and expectations and addresses the impact on the person or family",1],["Synthesises the information, checks understanding and communicates a safe, appropriate next step",1],["Asks about relevant pregnancy, delivery, newborn and feeding history",1],["Reviews growth and age appropriate developmental milestones",1],["Checks immunisation, childcare or school exposure and household context",1]]},"cah-c6":{"practiceTitle":"A Family ot specified, say “I have someone I can call if I need help.”","Work or study | If the case describes an occupation or school circumstances, use that description. Otherwise say “I can generally manage my normal day, although this issue is worrying me.”","Safety and emergency symptoms | If asked about serious symptoms that are expressly documented, give the stated answer. Do not volunteer an additional emergency symptom or contradiction; if no such symptoms are recorded, say “Nothing else alarming that I have noticed.”","Closing question | Near the end, if invited to ask questions, say “What do you think is going on, what happens next, and when should I get help urgently?”","Mood and functioning | If asked, describe the mood, anxiety, sleep, appetite, energy and activities already recorded in the case. If there are no additional changes listed, say “Nothing else has noticeably changed.”","Risk and safety | Answer directly and without hesitation when asked about thoughts of death, self harm, suicide, harming others, past attempts, plans, intent and access to means. Use the explicit risk history above; if absent say “No, I have not thought about hurting myself or anybody else.”","Perception and unusual experiences | If asked about hearing voices, suspiciousness, or unusual beliefs, use any case specific experiences; if none are present, say “No, nothing like that.”","Substances and medication effects | Discuss alcohol, drugs, medication adherence, adverse effects and withdrawals using the history above. Do not hide an explicitly documented substance issue.","Supports and safeguarding | If asked say who can support you as recorded. When nothing is specified, say “There is someone I could talk to, but it has still been difficult.”"],"volunteerGuide":"Read the original patient details and the original “give only if asked” answers first. Those always take priority over the standard responses below. Say the opening line naturally, then wait for questions. Never read out eve ation, bleeding and concerning pelvic mass"},"rnh-c11":{"impression":"Early pregnancy bleeding, likely miscarriage; establish viability and pregnancy location","support":"First trimester vaginal bleeding and cramping with positive pregnancy test","alternatives":"Threatened, incomplete, complete or missed miscarriage; ectopic pregnancy","priority":"Exclude ectopic pregnancy, major haemorrhage and septic miscarriage before confirming type of pregnancy loss"},"rnh-c12":{"impression":"Preterm prelabour rupture of membranes at 30 weeks","support":"Sudden clear fluid loss before labour and before 37 weeks","alternatives":"Urinary incontinence, physiological discharge, vaginitis and preterm labour with intact membranes","priority":"Exclude chorioamnionitis, cord prolapse, placental abruption and fetal compromise; avoid unnecessary digital examination"},"rnh-c13":{"impression":"Heavy menstrual bleeding; determine cause and assess anaemia","support":"Progressively heavier periods over one year","alternatives":"Fibroids, adenomyosis, endometrial polyp, ovulatory dysfunction and endometrial hyperplasia","priority":"Exclude pregnancy related bleeding, significant iron deficiency anaemia and endometrial malignancy when risk factors present"},"rnh-c14":{"impression":"Permanent contraception counselling for vasectomy","support":"Completed family and request for male sterilisation","alternatives":"Reversible contraception and female permanent contraception","priority":"Confirm informed voluntary choice, permanence, need for post vasectomy semen analysis and continued contraception until clearance"},"rnh-c15":{"impression":"Intermenstrual bleeding associated with ultrasound demonstrated endometrial polyp","support":"Bleeding between periods and 9 mm endometrial polyp","alternatives":"Cervical pathology, hormonal bleeding, endometrial hyperplasia, pregnancy related bleeding","priority":"Exclude cervical and endometrial malignancy where indicated and confirm pathology after removal"},"rnh-c16":{"impression":"Antenatal aneuploidy screening counselling at nine weeks gestation","support":"Patient requesting information on trisomy screening in early pregnancy","alternatives":"Combined first trimester screening, cell free DNA screening, diagnostic CVS or amniocentesis","priority":"Clearly distinguish screening from diagnosis; discuss limitations and potential harms of invasive testing"},"rnh-c17":{"impression":"Postmenopausal bleeding requiring investigation for endometrial cancer","support":"Vaginal bleeding twelve years after menopause","alternatives":"Endometrial atrophy, polyp, hyperplasia, cervical pathology and vaginal atrophy","priority":"Endometrial carcinoma is the key diagnosis to exclude; ensure prompt investigation and referral"},"rnh-c18":{"impression":"Individualised contraception choice and counselling, including etonogestrel implant","support":"Requests advice about the contraceptive implant","alternatives":"Combined pill, progestogen only pill, levonorgestrel IUD, copper IUD and injection","priority":"Exclude pregnancy and relevant medical contraindications; address STI protection and consent"},"gp-c1":{"impression":"Recurrent migraine, assess for aura and medication overuse","support":"Recurrent disabling headaches with episodic pattern","alternatives":"Tension type headache, cluster headache and medication overuse headache","priority":"Thunderclap onset, focal neurology, meningism, pregnancy related secondary headache and intracranial mass features"},"gp-c2":{"impression":"Osgood Schlatter disease, traction apophysitis of tibial tubercle","support":"Athletic adolescent with gradual activity related anterior knee pain below patella","alternatives":"Patellar tendinopathy, patellofemoral pain, osteochondritis dissecans, avulsion injury","priority":"Inability to weight bear, fever, hot joint, night pain and malignancy red flags"},"gp-c3":{"impression":"High grade squamous intraepithelial lesion on cervical cytology with oncogenic HPV r /* ---------- timer ---------- */
const T={id:null,phase:'idle',left:READ,running:false,h:null,lock:null};
let actx=null;
function chime(n){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const notes=n===2?[880,660,880]:[660,880];
    notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;
      const t0=actx.currentTime+i*.28;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.25,t0+.02);g.gain.exponentialRampToValueAtTime(.001,t0+.5);
      o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+.55)})}catch(e){}
}
async function wake(on){
  try{if(on&&!T.lock&&navigator.wakeLock){T.lock=await navigator.wakeLock.request('screen');T.lock.addEventListener('release',()=>T.lock=null)}
      if(!on&&T.lock){await T.lock.release();T.lock=null}}catch(e){}
}
function resetTimer(id){clearInterval(T.h);T.id=id;T.phase='idle';T.left=READ;T.running=false;wake(false)}
function startTimer(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(e){}
  if(T.phase==='up')return;
  if(T.phase==='idle')T.phase='read';
  T.running=true;wake(true);clearInterval(T.h);
  let last=Date.now();
  T.h=setInterval(()=>{const now=Date.now();if(now-last<1000)return;last+=1000;tickTimer()},200);
  paintTimer();
}
function pauseTimer(){T.running=false;clearInterval(T.h);wake(false);paintTimer()}
function tickTimer(){
  T.left--;
  if(T.left<=0){
    if(T.phase==='read'){T.phase='run';T.left=RUN;chime(1)}
    else{T.phase='up';T.left=0;T.running=false;clearInterval(T.h);wake(false);chime(2)}
  }
  paintTimer();
}
function skipReading(){if(T.phase==='idle'||T.phase==='read'){T.phase='run';T.left=RUN;if(!T.running)startTimer();else paintTimer()}}
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function phaseInfo(){
  return {idle:['Ready · 2 min reading, then 8 min station',''],read:['Reading time','read'],run:['Station time','run'],up:['Time up','up']}[T.phase];
}
function paintTimer(){
  const [label,cls]=phaseInfo();
  document.querySelectorAll('[data-digits]').forEach(el=>el.textContent=fmt(T.left));
  document.querySelectorAll('[data-phase]').forEach(el=>{el.textContent=label;el.className='phase '+cls});
  document.querySelectorAll('.clock').forEach(el=>el.classList.toggle('up',T.phase==='up'));
  const rDone=T.phase==='idle'?0:T.phase==='read'?READ-T.left:READ;
  const sDone=T.phase==='run'?RUN-T.left:T.phase==='up'?RUN:0;
  document.querySelectorAll('[data-track]').forEach(el=>el.innerHTML=`<i class="r" style="width:${rDone/(READ+RUN)*100}%"></i><i class="s" style="width:${sDone/(READ+RUN)*100}%"></i>`);
  document.querySelectorAll('[data-start]').forEach(b=>{b.textContent=T.running?'Pause':(T.phase==='idle'?'Start reading time':T.phase==='up'?'Done':'Resume');b.disabled=T.phase==='up'});
  document.querySelectorAll('[data-skip]').forEach(b=>b.hidden=!(T.phase==='idle'||T.phase==='read'));
}
function clockHtml(mini){
  return mini
  ?`<div class="mini clock"><span class="phase" data-phase></span><span class="digits" data-digits></span><span class="btns"><button class="btn" data-act="start" data-start></button></span></div>`
  :`<div class="card clock"><div class="clockface"><span class="digits" data-digits aria-live="off"></span><span class="phase" data-phase></span></div>
     <div class="track" data-track></div>
     <div class="btns"><button class="btn primary" data-act="start" data-start></button><button class="btn" data-act="skip" data-skip>Skip to station</button><button class="btn" data-act="reset">Reset</button></div></div>`;
}

/* ---------- views ---------- */
let fDom='all',fType='all',q='';
function scoreBadge(c){if(!touched(c.id))return '';const p=Math.round(totalOf(c)/maxOf(c)*100);return `<span class="score ${p>=70?'good':p>=50?'mid':'low'}">${p}%</span>`}
function types(c){return (Array.isArray(c.k)?c.k:[c.k]).map(k=>`<span class="type ${k}">${TYPES[k]}</span>`).join('')}
function home(){
  const match=c=>(fDom==='all'||c.dom.id===fDom)&&(fType==='all'||[].concat(c.k).includes(fType))&&(!q||(c.t+' '+c.stem+' '+c.dom.code).toLowerCase().includes(q));
  let body='';
  DOMAINS.forEach(d=>{const list=CASES.filter(c=>c.dom===d&&match(c));if(!list.length)return;
    body+=`<section class="domain" style="--dc:var(${d.c})"><div class="dhead"><span class="code">${d.code}</span><h2>${d.title}</h2><span class="muted" style="font-size:.8rem">${list.length}</span></div>
    ${list.map(c=>`<a class="crow" href="#${c.id}"><span class="nm">${esc(c.t)}</span>${types(c)}${scoreBadge(c)}</a>`).join('')}</section>`});
  const done=CASES.filter(c=>touched(c.id)).length;
  $('#app').innerHTML=`
   <div class="topbar">${CHECKLIST_URL?`<a href="${CHECKLIST_URL}">← OSCE Master Checklist</a>`:'<span></span>'}<span class="muted sync" id="sync">${syncText}</span></div>
   <div class="casehead"><h1>OSCE Practice Cases</h1><p class="muted" style="margin:0">${CASES.length} stations from past JCU OSCEs, 2011–2023. Each case gives 2 minutes' reading time, then an 8 minute station. ${done?`You've marked ${done} so far.`:''}</p></div>
   <div class="controls"><input id="q" type="search" placeholder="Search cases…" value="${esc(q)}" aria-label="Search cases"></div>
   <div class="controls">${[['all','All domains'],...DOMAINS.map(d=>[d.id,d.code])].map(([v,l])=>`<button class="chipbtn" data-fdom="${v}" aria-pressed="${fDom===v}">${l}</button>`).join('')}</div>
   <div class="controls">${[['all','All types'],...Object.entries(TYPES)].map(([v,l])=>`<button class="chipbtn" data-ftype="${v}" aria-pressed="${fType===v}">${l}</button>`).join('')}</div>
   <div style="display:flex;flex-direction:column;gap:18px">${body||'<div class="empty">No cases match.</div>'}</div>`;
  const qi=$('#q');qi.addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();const pos=qi.selectionStart;home();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)});
}
function para(s){return s.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}
function nav(c){const i=ORDER.indexOf(c),p=ORDER[i-1],n=ORDER[i+1];
  return `<div class="pager">${p?`<a class="btn" href="#${p.id}">← ${esc(p.t)}</a>`:'<span></span>'}${n?`<a class="btn" href="#${n.id}">${esc(n.t)} →</a>`:''}</div>`}
function caseView(c){
  if(T.id!==c.id)resetTimer(c.id);
  $('#app').innerHTML=`
   <div class="topbar"><a href="#">← All cases</a>${CHECKLIST_URL?`<a href="${CHECKLIST_URL}">Checklist</a>`:''}</div>
   <div class="casehead" style="--dc:var(${c.dom.c})"><div class="meta"><span class="code">${c.dom.code}</span>${types(c)}${c.yr?`<span class="type">${esc(c.yr)}</span>`:''}</div><h1>${esc(c.t)}</h1></div>
   <div class="card door" style="--dc:var(${c.dom.c})">
     <span class="lbl">Candidate instructions</span>
     <div><b>${esc(c.role)}</b></div>
     <div class="stem">${para(c.stem)}</div>
     <span class="lbl">Your tasks</span>
     <ol class="tasks">${c.tasks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>
   </div>
   ${clockHtml(false)}
   ${c.eq&&c.eq.length?`<div class="card eq"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="lbl">Examiner questions</span><button class="btn" data-act="eq" aria-expanded="false">Show examiner questions</button></div><ol id="eqlist" hidden>${c.eq.map(x=>`<li>${esc(x[0])}</li>`).join('')}</ol></div>`:''}
   <a class="marklink" href="#${c.id}-mark"><span><b>Script / marking sheet</b><br><span class="muted" style="font-size:.85rem">Patient script, ${c.m.length+2} marking items, ${c.eq&&c.eq.length?'model answers':'self-scoring'}</span></span><span aria-hidden="true">→</span></a>
   ${nav(c)}`;
  paintTimer();
}
/* Volunteer script layout: preserve every source answer, group by history domain. */
const HISTORY_SECTIONS=[
 ['present','History of presenting complaint'],
 ['systems','Systems review and red flags'],
 ['past','Past medical and surgical history'],
 ['meds','Medications and allergies'],
 ['family','Family history'],
 ['social','Social and personal history'],
 ['paeds','Paediatric history'],
 ['obgyn','Obstetric, gynaecological and sexual history'],
 ['mental','Psychiatric and risk history'],
 ['ice','Ideas, concerns and expectations'],
 ['closing','Closing and safety netting']
];
function historyGroup(label,domain){
 const x=label.toLowerCase();
 if(/getting to know|patient.s own explanation|main worry|what they want|ideas|concern|expectation|daily life/.test(x))return 'ice';
 if(/birth|neonatal|milestone|development|immunis|vaccin|feeding|growth|school|childhood|paediatric|pediatric/.test(x))return 'paeds';
 if(/pregnan|antenatal|obstetric|menstrual|period|contracept|sexual|gynaec|gynecol/.test(x))return 'obgyn';
 if(/suicid|self.harm|psych|mood history|mental health history/.test(x))return 'mental';
 if(/medicin|medication|drug allerg|regular tablets|nonprescription|supplement|treatments already tried/.test(x))return 'meds';
 if(/family history|familial|inherited|relative/.test(x))return 'family';
 if(/past illnesses|previous operations|hospital admission|medical history|surgery/.test(x))return 'past';
 if(/smok|vap|alcohol|recreational|home and support|work or study|occupation|living|social history/.test(x))return 'social';
 if(/closing question|follow.up|safety.net/.test(x))return 'closing';
 if(/other symptoms|safety and emergency|review of systems|red flag/.test(x))return 'systems';
 return 'present';
}
function structuredAnswers(c){
 const src=c.script||{},groups={};HISTORY_SECTIONS.forEach(([key])=>groups[key]=[]);
 (src.ask||[]).forEach(v=>{
  // Original source answers retain their full wording and original order.
  const label=String(v).split(':')[0];
  const key=historyGroup(label,c.dom.code);
  groups[key].push({value:String(v),original:true});
 });
 (c.additionalScript||[]).forEach(v=>{
  const split=String(v).indexOf(' | '),label=split<0?'Further information':v.slice(0,split),answer=split<0?v:v.slice(split+3);
  groups[historyGroup(label,c.dom.code)].push({label, value:answer,original:false});
 });
 return HISTORY_SECTIONS.filter(([key])=>groups[key].length).map(([key,title])=>`<section class="hx-section hx-${key}"><h3>${esc(title)}</h3><ul class="hx-items">${groups[key].map(item=>`<li>${item.label?`<strong>${esc(item.label)}:</strong> `:''}${esc(item.value)}</li>`).join('')}</ul></section>`).join('');
}
function volunteerScript(c){
 const sc=c.script||{};
 return `<div class="card volunteer-card">
  <div class="volunteer-card-title"><span class="lbl">Simulated patient script</span><span class="type">Volunteer copy</span></div>
  <section class="hx-section hx-profile"><h3>Patient profile</h3>
    ${sc.who?`<p><strong>Patient or caregiver:</strong> ${esc(sc.who)}</p>`:''}
    <p><strong>Clinical setting:</strong> ${esc(c.role||'Refer to the station instructions')}</p>
  </section>
  ${sc.open?`<section class="hx-section hx-opening"><h3>Opening statement</h3><p class="quote">“${esc(sc.open)}”</p><p class="hx-note">Say this naturally at the beginning. Reveal the remaining information when the student asks the relevant questions.</p></section>`:''}
  ${sc.act?`<section class="hx-section"><h3>How to portray the patient</h3><p>${esc(sc.act)}</p></section>`:''}
  ${structuredAnswers(c)}
  ${sc.raise&&sc.raise.length?`<section class="hx-section hx-ice"><h3>Concerns and questions to raise</h3><ul class="hx-items">${sc.raise.map(x=>`<li>“${esc(x)}”</li>`).join('')}</ul></section>`:''}
  ${sc.fx&&sc.fx.length?`<section class="hx-section"><h3>Examination findings for the examiner</h3><ul class="hx-items">${sc.fx.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
  ${c.volunteerGuide?`<section class="hx-section hx-guide"><h3>Instructions for the volunteer</h3><p>${esc(c.volunteerGuide)}</p></section>`:''}
 </div>`;
}
function markView(c){
  if(T.id!==c.id)resetTimer(c.id);
  const s=getS(c.id),max=maxOf(c);
  const rows=c.m.map((x,i)=>`<label class="mrow${s.t.includes(i)?' on':''}" data-i="${i}"><input type="checkbox" id="m-${c.id}-${i}" ${s.t.includes(i)?'checked':''}><span class="box">${tick}</span><span class="txt">${esc(x[0])}</span><span class="pts">${x[1]}</span></label>`).join('');
  const seg=(key,label)=>`<div class="rating"><span class="txt" style="font-size:.92rem">${label}</span><span class="seg" data-key="${key}">${[0,1,2,3,4,5].map(n=>`<button data-v="${n}" aria-pressed="${s[key]===n}" aria-label="${label} ${n}">${n}</button>`).join('')}</span></div>`;
  const sc=c.script;
  $('#app').innerHTML=`
   <div class="topbar"><a href="#${c.id}">← Back to case</a><span class="muted sync" id="sync">${syncText}</span></div>
   ${clockHtml(true)}
   <div class="casehead" style="--dc:var(${c.dom.c})"><div class="meta"><span class="code">${c.dom.code}</span>${types(c)}</div><h1>${esc(c.t)}</h1><span class="muted">Script and marking sheet</span></div>
   ${volunteerScript(c)}
   <div class="card">
     <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="lbl">Marking checklist</span><button class="btn" data-act="clear">Clear marks</button></div>
     <div class="mtable">${rows}${seg('g','Global rating (examiner)')}${seg('e','Empathy rating (patient)')}
       <div class="total"><span>Total</span><span class="big" id="tot">${totalOf(c)} / ${max}</span></div></div>
   </div>
   ${EXAMINER_IMPRESSIONS[c.id]?`<div class="card answers examiner-impression"><span class="lbl">Expected diagnosis or clinical impression</span><div class="qa"><b>Most likely diagnosis / expected clinical conclusion</b><span>${esc(EXAMINER_IMPRESSIONS[c.id].impression)}</span></div><div class="qa"><b>Key supporting findings</b><span>${esc(EXAMINER_IMPRESSIONS[c.id].support)}</span></div><div class="qa"><b>Relevant differentials or alternatives</b><span>${esc(EXAMINER_IMPRESSIONS[c.id].alternatives)}</span></div><div class="qa"><b>Important exclusions and safety priorities</b><span>${esc(EXAMINER_IMPRESSIONS[c.id].priority)}</span></div><p class="muted" style="font-size:.82rem;margin:12px 0 0">Examiner reference only. Not an additional scored checklist item.</p></div>`:''}
   ${c.eq&&c.eq.length?`<div class="card answers"><span class="lbl">Examiner questions · model answers</span>${c.eq.map(x=>`<div class="qa"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div>`:''}
   ${c.ref?`<p class="muted" style="font-size:.8rem;margin:0">Based on: ${esc(c.ref)}</p>`:''}
   ${nav(c).replace(/href="#([a-z0-9-]+)"/g,'href="#$1-mark"')}`;
  paintTimer();
}

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  const mk=h.endsWith('-mark'),id=mk?h.slice(0,-5):h;
  const c=BY[id];
  if(!c){home();window.scrollTo(0,0);return}
  mk?markView(c):caseView(c);window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-fdom],[data-ftype],.seg button,.mrow');if(!b)return;
  if(b.dataset.fdom){fDom=b.dataset.fdom;home();return}
  if(b.dataset.ftype){fType=b.dataset.ftype;home();return}
  const act=b.dataset.act;
  if(act==='start'){T.running?pauseTimer():startTimer();return}
  if(act==='skip'){skipReading();return}
  if(act==='reset'){resetTimer(T.id);paintTimer();return}
  if(act==='eq'){const l=$('#eqlist');l.hidden=!l.hidden;b.textContent=l.hidden?'Show examiner questions':'Hide examiner questions';b.setAttribute('aria-expanded',!l.hidden);return}
  const c=BY[T.id];if(!c)return;const s=getS(c.id);
  if(b.classList.contains('mrow')){e.preventDefault();const i=+b.dataset.i;const k=s.t.indexOf(i);k<0?s.t.push(i):s.t.splice(k,1);b.classList.toggle('on',k<0);b.querySelector('input').checked=k<0}
  else if(b.parentElement.classList.contains('seg')){const key=b.parentElement.dataset.key,v=+b.dataset.v;s[key]=s[key]===v?null:v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===s[key]))}
  else if(act==='clear'){scores[c.id]={t:[],g:null,e:null};persist();markView(c);return}
  else return;
  s.at=Date.now();persist();$('#tot').textContent=`${totalOf(c)} / ${maxOf(c)}`;
});
document.addEventListener('keydown',e=>{const r=e.target.closest&&e.target.closest('.mrow');if(r&&(e.key===' '||e.key==='Enter')){e.preventDefault();r.click()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T.running)wake(true)});
window.addEventListener('hashchange',route);
route();

(async()=>{try{
  if(!window.claude?.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  remote=db.collection('data/users/'+uid).doc('osce-practice-scores');
  let first=true;
  remote.onSnapshot(snap=>{
    if(snap.exists){const r=snap.data()?.scores||{};
      if(first){for(const k in scores){if(!r[k]||(scores[k].at||0)>(r[k].at||0))r[k]=scores[k]}}
      const clean={};for(const k in r)if(BY[k])clean[k]=r[k];scores=clean;
      try{localStorage.setItem(LS,JSON.stringify(scores))}catch(e){}
      if(first)persist();
      if(!BY[decodeURIComponent(location.hash.slice(1)).replace(/-mark$/,'')])home();
    }else if(first&&Object.keys(scores).length)persist();
    first=false;setSync('Scores synced to your account');
  },()=>{});
}catch(e){}})();
</script>
