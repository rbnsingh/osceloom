/* Clear, scannable volunteer history sections */
.volunteer-card{gap:0;padding:0;overflow:hidden}
.volunteer-card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.hx-section{padding:18px 20px;border-bottom:1px solid var(--line)}
.hx-section:last-child{border-bottom:0}
.hx-section h3{font-family:var(--f-display);font-size:1.08rem;line-height:1.35;font-weight:800;margin:0 0 12px;color:var(--fg)}
.hx-section p{margin:0 0 8px;line-height:1.65}
.hx-section p:last-child{margin-bottom:0}
.hx-section .quote{font-size:1.05rem;border-left:3px solid var(--accent);padding:10px 14px;margin:0 0 12px;background:var(--accent-soft);border-radius:0 8px 8px 0}
.hx-items{list-style:disc;margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.hx-items li{padding-left:3px;line-height:1.6;overflow-wrap:anywhere}
.hx-items li::marker{color:var(--accent)}
.hx-items strong{font-weight:700;color:var(--fg)}
.hx-note{color:var(--muted);font-size:.88rem}
.hx-guide{background:var(--surface-2)}
.hx-profile{background:var(--surface-2)}
@media(max-width:520px){.hx-section{padding:16px}.volunteer-card-title{padding:14px 16px}.hx-items{padding-left:19px;gap:12px}}
</style>

<body>
<title>OSCE Practice Cases</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one reading column; home lists cases by domain, a case shows the door sheet + station clock, the marking view is the examiner's clipboard. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --surface-2:#f5f8f8; --line:#d9e1e3;
  --fg:#16252b; --muted:#5b6d74; --accent:#0f6e7a; --accent-soft:#d6ecee;
  --done:#2c8a55; --done-soft:#e3f3e9; --hot:#b4471f; --hot-soft:#fbe7dd; --read:#8a5a00; --read-soft:#fbefd6;
  --c-rnh:#c2417a; --c-gp:#2f6fc0; --c-ah2:#c4701a; --c-cah:#7b4fc4; --c-mh:#13877a; --c-ah1:#c23a3a;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1619; --surface:#152126; --surface-2:#1a2930; --line:#26383f;
  --fg:#e3ecee; --muted:#93a7ad; --accent:#5cc3cf; --accent-soft:#183c42;
  --done:#5ccb8a; --done-soft:#173326; --hot:#f08a5d; --hot-soft:#3a2219; --read:#f0c060; --read-soft:#3a2f17;
  --c-rnh:#ec7aab; --c-gp:#73a6ec; --c-ah2:#eba35a; --c-cah:#ad8bf0; --c-mh:#4fcfbf; --c-ah1:#f07878;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#152126; --surface-2:#1a2930; --line:#26383f;
  --fg:#e3ecee; --muted:#93a7ad; --accent:#5cc3cf; --accent-soft:#183c42;
  --done:#5ccb8a; --done-soft:#173326; --hot:#f08a5d; --hot-soft:#3a2219; --read:#f0c060; --read-soft:#3a2f17;
  --c-rnh:#ec7aab; --c-gp:#73a6ec; --c-ah2:#eba35a; --c-cah:#ad8bf0; --c-mh:#4fcfbf; --c-ah1:#f07878;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-weight:800;font-size:1.6rem;letter-spacing:-.01em}
h2{font-weight:600;font-size:1.15rem}
h3{font-weight:600;font-size:1rem}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem}
.btn{font:inherit;font-weight:700;font-size:.88rem;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);color:var(--surface);border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chipbtn:focus-visible,a:focus-visible,.mrow input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--f-mono);font-size:.72rem;font-weight:500;padding:3px 7px;border-radius:6px;color:var(--surface);background:var(--dc,var(--accent))}
.type{font-family:var(--f-mono);font-size:.7rem;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.type.Hx{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.type.Couns{background:var(--read-soft);color:var(--read);border-color:transparent}
.type.Exam{background:var(--done-soft);color:var(--done);border-color:transparent}
.type.Mx{background:var(--hot-soft);color:var(--hot);border-color:transparent}

/* home */
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.controls input{flex:1 1 200px;min-width:0;font:inherit;font-size:.9rem;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--fg)}
.chipbtn{font:inherit;font-size:.8rem;font-weight:700;padding:6px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chipbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
section.domain{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.dhead h2{flex:1;min-width:0}
.crow{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--fg)}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow .nm{flex:1;min-width:0;font-weight:700;font-size:.95rem}
.score{font-family:var(--f-mono);font-size:.75rem;padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.good{background:var(--done-soft);color:var(--done)}
.score.mid{background:var(--read-soft);color:var(--read)}
.score.low{background:var(--hot-soft);color:var(--hot)}

/* case */
.casehead{display:flex;flex-direction:column;gap:8px}
.casehead .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.door{border-left:4px solid var(--dc);}
.stem p{margin:0 0 .6em}
.stem p:last-child{margin:0}
ol.tasks{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.clock{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.clockface{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.digits{font-family:var(--f-mono);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.phase{font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.phase.read{background:var(--read-soft);color:var(--read)}
.phase.run{background:var(--accent-soft);color:var(--accent)}
.phase.up{background:var(--hot-soft);color:var(--hot)}
.track{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.track i{display:block;height:100%}
.track .r{background:var(--read)}
.track .s{background:var(--accent)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.clock.up .digits{color:var(--hot)}
.eq{display:flex;flex-direction:column;gap:8px}
.eq ol{margin:0;padding-left:1.3em}
.marklink{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px dashed var(--line);border-radius:14px;text-decoration:none;color:var(--fg);background:var(--surface)}
.marklink:hover{border-color:var(--accent)}
.marklink b{font-family:var(--f-display);font-size:1.05rem}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* marking */
.mini{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;flex-wrap:wrap}
.mini .digits{font-size:1.5rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.quote{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0;padding:10px 14px;border-radius:10px;background:var(--surface-2)}
ul.plain{margin:0;padding-left:1.15em;display:flex;flex-direction:column;gap:4px}
.mtable{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow input{position:absolute;opacity:0;pointer-events:none}
.mrow .box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px;background:var(--surface)}
.mrow .box svg{opacity:0}
.mrow.on{background:var(--done-soft)}
.mrow.on .box{background:var(--done);border-color:var(--done)}
.mrow.on .box svg{opacity:1}
.mrow .txt{flex:1;min-width:0;font-size:.92rem}
.mrow .pts{flex:none;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rating{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line)}
.seg{display:flex;gap:4px}
.seg button{font:inherit;font-family:var(--f-mono);font-size:.82rem;width:34px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:transparent}
.total{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--surface-2);font-weight:700;flex-wrap:wrap}
.total .big{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.answers{display:flex;flex-direction:column;gap:10px}
.answers .qa b{display:block}
.empty{padding:24px 16px;text-align:center;color:var(--muted)}
.sync{font-size:.75rem}
@media (max-width:480px){.digits{font-size:2.7rem}h1{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const CHECKLIST_URL="index.html";
const DOMAINS=[
 {id:'rnh',code:'RNH',title:'Reproductive & Neonatal Health',c:'--c-rnh'},
 {id:'gp',code:'GP',title:'General Practice',c:'--c-gp'},
 {id:'ah2',code:'AH2',title:'Adult Health 2 / Surgery',c:'--c-ah2'},
 {id:'cah',code:'CAH',title:'Child & Adolescent Health',c:'--c-cah'},
 {id:'mh',code:'MH',title:'Mental Health',c:'--c-mh'},
 {id:'ah1',code:'AH1',title:'Adult Health 1 / Medicine',c:'--c-ah1'}];
const TYPES={Hx:'History',Couns:'Counselling',Exam:'Examination',Mx:'Management'};
const CASES=[];function add(list){list.forEach(c=>CASES.push(c))}
</script>
<script>
add([
{id:'rnh-c1',t:'Postnatal Visit',k:'Hx',yr:'2012',
role:'You are a GP registrar in a general practice.',
stem:'Emma Walsh, 31, is seeing you 6 weeks after an uncomplicated vaginal birth of her first baby, Noah. Her cervical screening test (CST) from 2 weeks before she fell pregnant was reported as "HPV not detected". She has come for her postnatal check.',
tasks:['Take a focused postnatal history from Emma.','Address her immunisation questions for herself and Noah.','Explain her cervical screening result and when her next test is due.'],
script:{who:'Emma, 31, first-time mum. Tired but well. Breastfeeding.',open:'I think everything is okay, but I have a few questions about needles for both of us.',
act:'Friendly, a bit tired. Becomes teary only if asked directly about mood.',
ask:['Lochia stopped at 4 weeks. No offensive discharge, fever or heavy bleeding.','Second-degree tear, healed. Mild discomfort with sex, which she has tried once.','Breastfeeding going well; one episode of a sore nipple, resolved. No breast redness.','Bowels and bladder normal; occasional leak when sneezing.','Mood: "Some days I cry for no reason, but I love him." Sleeping when baby sleeps. No thoughts of harming self or baby. Partner supportive.','Not using contraception. Does not want another baby for at least 2 years.','Had pertussis (dTpa) and flu vaccines in pregnancy. Not sure if she is immune to rubella.'],
raise:['Does Noah need his needles at 6 weeks, and which ones?','Can I have vaccines while breastfeeding?','Do I need another smear now?'],
fx:['BP 118/72. Abdomen: uterus not palpable. Perineum healed.','Edinburgh Postnatal Depression Scale (EPDS) if done: 8.','Antenatal rubella serology: non-immune.']},
eq:[['Which vaccines are due for Noah at 6 weeks under the National Immunisation Program (Qld)?','DTPa-hepB-IPV-Hib (hexavalent), 13-valent pneumococcal conjugate, rotavirus (oral), and meningococcal B (Aboriginal and Torres Strait Islander children in Qld; recommended/private for others). The 6-week dose can be given from 6 weeks of age.'],['When is her next cervical screening test due?','HPV not detected → next CST in 5 years from that test. Pregnancy and the postnatal period do not change the interval.']],
m:[['Introduces self, confirms identity, congratulates and builds rapport',1],['Asks about lochia, bleeding, fever or offensive discharge',1],['Asks about perineum/wound healing and resumption of intercourse',1],['Asks about breastfeeding and breast symptoms (mastitis)',1],['Asks about bladder and bowel function (incontinence)',1],['Screens mood with open questions or EPDS; asks about thoughts of self-harm or harm to baby',2],['Asks about sleep, supports and partner',1],['Discusses contraception (e.g. progestogen-only options or IUD while breastfeeding)',2],['Explains baby\'s 6-week immunisations correctly',2],['Recommends MMR now for rubella non-immunity; safe while breastfeeding; avoid pregnancy for 28 days',2],['Explains CST result correctly: next test in 5 years',2],['Arranges follow-up / safety-nets for mood or bleeding concerns',1]],
ref:'Australian Immunisation Handbook; National Cervical Screening Program; RANZCOG postnatal care.'},

{id:'rnh-c2',t:'Placenta Previa',k:['Hx','Couns'],yr:'2013, 2019',
role:'You are a junior doctor in the birth suite of a regional hospital.',
stem:'Hannah Lee, 28, G2P1, is 32 weeks pregnant. She presents with a painless episode of bright red vaginal bleeding this morning, about 100 mL, which has now settled. Her 20-week morphology scan reported a "low-lying placenta". A repeat ultrasound today shows the placenta completely covering the internal cervical os.',
tasks:['Take a focused history.','Explain the ultrasound finding to Hannah.','Outline your management plan.'],
script:{who:'Hannah, 28. Scared but composed.',open:'I just stood up from the couch and there was blood everywhere. Is my baby okay?',
act:'Anxious about the baby; asks lots of "what if" questions.',
ask:['Painless bleeding, bright red, soaked one pad; stopped now. No contractions.','Baby moving normally.','Previous baby born by caesarean 3 years ago (for failure to progress).','No trauma or recent sex. No leaking fluid.','Blood group O negative. Had anti-D at 28 weeks.','No previous bleeding this pregnancy. Lives 1 hour from hospital, partner works FIFO.'],
raise:['Can I still have a normal birth?','Do I have to stay in hospital?','Will I need a blood transfusion?'],
fx:['HR 88, BP 115/70. Uterus soft, non-tender, fundus 32 cm. CTG normal.','Speculum: small amount of old blood at os. NO digital vaginal exam.']},
eq:[['Why is a previous caesarean section important here?','It raises the risk of placenta accreta spectrum when the placenta lies over the scar. An MRI or specialised ultrasound may be needed and delivery should be planned at a centre with blood bank and surgical support.'],['When would you plan delivery?','Planned caesarean section at about 36+0 to 37+6 weeks if stable (earlier, e.g. 34–36 weeks, with suspected accreta or recurrent bleeding), or earlier for heavy or ongoing bleeding.']],
m:[['Introduces self and confirms identity and gestation',1],['Characterises bleeding: amount, colour, pain, ongoing',2],['Asks about fetal movements, contractions, ROM, trauma/postcoital',1],['Obstetric history: previous caesarean section identified',1],['Asks blood group / Rh status and anti-D',1],['States no digital vaginal exam',1],['Explains placenta praevia in plain language',2],['Explains vaginal birth is not possible; plan for caesarean section',1],['Admits for observation; IV access, FBC, group and hold/crossmatch, Kleihauer',2],['Gives anti-D (Rh negative) and corticosteroids (<34+6 weeks)',2],['Mentions accreta risk with previous CS; involves senior/obstetric team',1],['Discusses discharge criteria and to return immediately with any bleeding; consider staying near hospital',2],['Checks understanding and addresses concerns',1]],
ref:'RANZCOG Placenta Praevia / Accreta guidelines; Queensland Clinical Guidelines (QCG) Antepartum haemorrhage.'},

{id:'rnh-c3',t:'Pre-eclampsia',k:['Hx','Exam','Couns'],yr:'2011, 2014',
role:'You are a junior doctor in the antenatal clinic.',
stem:'Sophie Nguyen, 19, primigravida, is 38 weeks pregnant. She has had headaches for 2 days. The midwife found +++ protein on urine dipstick.',
tasks:['Take a focused history.','Measure Sophie\'s blood pressure manually and state the reading.','Explain the likely diagnosis and outline your management.'],
script:{who:'Sophie, 19. Wants to go home.',open:'It\'s just a headache. I need to pick my sister up from the airport at 5.',
act:'Reluctant to stay; agrees if the risks are explained clearly.',
ask:['Frontal headache, 2 days, not helped by paracetamol.','Spots in vision this morning.','Mild pain under right ribs.','Hands and face swollen for a week.','Baby moving normally. No bleeding, no fluid leak.','No previous BP problems. Mum had "high blood pressure in pregnancy".'],
raise:['Can I just take something for the headache and go?','Is my baby in danger?'],
fx:['BP 162/104 (repeat 158/106). HR 90.','Reflexes brisk, 2 beats of clonus. RUQ tenderness.','Fundus 37 cm, CTG reassuring.']},
eq:[['What investigations would you order?','FBC (platelets), U&E/creatinine, LFTs, urate, LDH, coagulation studies, urine protein:creatinine ratio, CTG and ultrasound for growth, liquor and Dopplers.'],['What is the definitive treatment?','Delivery of the baby and placenta. At 38 weeks with severe features, plan delivery after maternal stabilisation.']],
m:[['Introduces self, explains purpose',1],['Asks about headache, visual disturbance, RUQ/epigastric pain',2],['Asks about oedema, fetal movements, bleeding',1],['Asks risk factors (primigravida, family history, prior HTN)',1],['Manual BP: correct cuff, arm at heart level, Korotkoff V for diastolic',2],['States reading correctly',1],['Explains pre-eclampsia in plain language',2],['Explains need for admission and why going home is unsafe',2],['Antihypertensive (e.g. oral nifedipine or labetalol; IV hydralazine if severe)',1],['Magnesium sulfate for seizure prophylaxis given severe features',2],['Bloods: FBC, UEC, LFT, coags, urate; urine PCR; fetal monitoring',1],['Plans delivery after stabilisation; senior/obstetric involvement',2],['Addresses concerns empathetically',1]],
ref:'SOMANZ Guideline for the Management of Hypertensive Disorders of Pregnancy; QCG Hypertension and pregnancy.'},

{id:'rnh-c4',t:'Breech Presentation',k:'Couns',yr:'2015',
role:'You are a junior doctor in the antenatal clinic.',
stem:'Kate Morris, 33, G2P1, is 36 weeks pregnant. Ultrasound confirms a frank breech presentation with normal liquor and an anterior placenta. Her first baby was born by lower segment caesarean section for fetal distress 3 years ago.',
tasks:['Take a brief relevant history.','Explain the options for managing the breech presentation, including the risks and benefits of each.','Answer Kate\'s questions.'],
script:{who:'Kate, 33. Wanted to try for a vaginal birth this time.',open:'The scan says the baby is upside down the wrong way. What does that mean for me?',
act:'Calm and well informed; disappointed at losing her hoped-for VBAC.',
ask:['Uncomplicated pregnancy. No bleeding.','Previous lower segment caesarean section (LSCS) for fetal distress, no complications.','Blood group A positive.'],
raise:['Can you turn the baby?','Can I still have a vaginal birth?','Is turning the baby safe for my scar?']},
eq:[['What is the success rate of external cephalic version (ECV)?','About 40–60% overall; lower in nulliparous women. Spontaneous reversion after successful ECV is uncommon (~5%).'],['List contraindications to ECV.','Where caesarean is indicated anyway (e.g. placenta praevia), APH in the last 7 days, abnormal CTG, ruptured membranes, multiple pregnancy, major uterine anomaly. A previous LSCS is a relative, not absolute, contraindication.']],
m:[['Introduces self, confirms gestation and understanding of breech',1],['Asks obstetric history incl. reason for previous LSCS',1],['Checks for contraindications to ECV (bleeding, placenta, liquor, ROM)',2],['Explains breech presentation in plain language',1],['Explains ECV: what is done, timing (from 36–37 weeks), success rate',2],['ECV risks: transient fetal heart changes, placental abruption, ROM, emergency CS (~1 in 200)',2],['Notes previous LSCS is a relative contraindication; ECV still possible with counselling',1],['Option of planned caesarean section at 39 weeks: risks/benefits',2],['Vaginal breech birth generally not recommended with previous CS; explains why',1],['Anti-D not needed (Rh positive); CTG before and after ECV',1],['Shared decision-making, checks understanding, offers written info',2]],
ref:'RANZCOG Management of breech presentation at term; QCG.'},

{id:'rnh-c5',t:'Preterm Labour',k:['Hx','Mx'],yr:'2016',
role:'You are the doctor on duty at a rural hospital without an obstetric unit. The nearest tertiary centre is a 2-hour drive away.',
stem:'Jess Carter, 24, G1P0, is 33 weeks pregnant. She presents with regular, painful tightenings every 5 minutes for the last 3 hours. She has not noticed any fluid loss.',
tasks:['Take a focused history.','State the examination and investigations you would perform.','Outline your management, including transfer.'],
script:{who:'Jess, 24, first pregnancy. Partner is driving down from the mine.',open:'It\'s too early. Is the baby coming now?',
act:'Frightened; has to stop talking during each contraction.',
ask:['Tightenings every 5 minutes, 40 seconds each, getting stronger.','No fluid loss. Small mucousy "show" today.','Some burning when passing urine for 2 days.','Baby moving well.','No previous pregnancies. Smokes 10/day.','Group B strep status not known.'],
raise:['Will my baby survive?','Can I have the baby here?']},
eq:[['Which medications would you give?','Tocolysis with nifedipine (to allow steroids and transfer), betamethasone 11.4 mg IM two doses 24 h apart, IV benzylpenicillin for GBS prophylaxis if in established labour with unknown GBS status. Magnesium sulfate for neuroprotection is given under 30 weeks, so not routinely here.'],['What is the role of fetal fibronectin?','A negative fFN between 24 and 34 weeks (with intact membranes and cervix <3 cm) has a high negative predictive value for delivery within 7–14 days.']],
m:[['Introduces self, calm reassuring manner',1],['Contractions: onset, frequency, duration, strength',1],['Asks about ROM, bleeding, show',1],['Asks about infection symptoms (UTI, fever)',1],['Asks fetal movements, GBS status, smoking, obstetric history',1],['Exam: vitals, abdominal palpation, sterile speculum (avoid digital VE if ?ROM)',2],['Investigations: CTG, urine MCS, high vaginal/low vaginal swabs (GBS), fFN, FBC/CRP',2],['Calls obstetric team at tertiary centre and RSQ (Retrieval Services Queensland)',2],['Tocolysis (nifedipine) to allow transfer',1],['Betamethasone for fetal lung maturity',2],['Antibiotics for GBS prophylaxis if in labour',1],['Explains plan to Jess and addresses her concerns',2],['Prepares for delivery if imminent (neonatal resus, call for help)',1]],
ref:'QCG Preterm labour and birth; RSQ retrieval guidance.'},

{id:'rnh-c6',t:'Ectopic Pregnancy',k:['Hx','Mx'],yr:'2017',
role:'You are a junior doctor in the emergency department.',
stem:'Mia Thompson, 26, presents with left lower abdominal pain for 6 hours. Her last menstrual period was 7 weeks ago. A home pregnancy test was positive yesterday.',
tasks:['Take a focused history.','State the examination findings you would look for.','List your investigations and outline management.'],
script:{who:'Mia, 26. In pain, pale.',open:'The pain on my left side is getting worse, and now my shoulder hurts.',
act:'Holds left lower abdomen; sits very still.',
ask:['Sharp left iliac fossa pain, constant, 7/10, worse in the last hour.','Right shoulder-tip pain since 30 minutes ago.','Light brown spotting since yesterday.','Felt faint standing up.','Treated for chlamydia 2 years ago. Copper IUD removed 6 months ago.','First pregnancy. Not planned but wanted.'],
raise:['Am I losing the baby?','Will I be able to get pregnant again?'],
fx:['HR 112, BP 96/60, RR 20, afebrile.','Tender left iliac fossa with guarding. Cervical motion tenderness.','Serum beta-hCG 2,400 IU/L. Transvaginal ultrasound: empty uterus, left adnexal mass, free fluid in pouch of Douglas.']},
eq:[['What are the management options for ectopic pregnancy?','Surgical (laparoscopic salpingectomy or salpingostomy) is required here as she is haemodynamically unstable with signs of rupture. Methotrexate is for stable women with low hCG (generally <3,000–5,000), small mass, no fetal heart and no rupture. Expectant management for very low and falling hCG.']],
m:[['Introduces self, recognises she is unwell, offers analgesia',1],['Pain: site, onset, character, severity, radiation (shoulder tip)',2],['Asks about PV bleeding and dizziness/syncope',1],['Asks risk factors: PID/STI, IUD, previous ectopic, tubal surgery, IVF',2],['LMP, contraception, obstetric history',1],['Exam: vitals with shock signs, abdominal guarding, cervical motion tenderness',2],['Investigations: quantitative beta-hCG, TVUS, FBC, group and hold/crossmatch',2],['Recognises haemodynamically unstable ruptured ectopic',2],['Resus: 2 large-bore IVs, fluids, blood products, call O&G and anaesthetics',2],['Urgent laparoscopy/laparotomy; methotrexate not appropriate here',1],['Anti-D if Rh negative',1],['Explains to Mia with empathy; future fertility generally preserved',1]],
ref:'QCG Early pregnancy loss; RANZCOG.'},

{id:'rnh-c7',t:'Caesarean Section Counselling',k:'Couns',yr:'2018',
role:'You are a junior doctor in the antenatal clinic. The GP\'s referral letter is attached.',
stem:'Laura Bennett, 29, G2P1, is 20 weeks pregnant. Her first birth was a forceps delivery complicated by a third-degree perineal tear. Afterwards she had faecal incontinence and pain during sex, which required repair by the surgical team. She is worried it will happen again and wants to discuss a caesarean section.',
tasks:['Take a brief antenatal history.','Explain what a caesarean section involves.','Discuss the benefits and risks of a caesarean section compared with a vaginal birth.'],
script:{who:'Laura, 29. Firm in her wish for a caesarean section.',open:'I am not going through that again. I want a caesarean.',
act:'Anxious; feels she was not listened to last time.',
ask:['Pregnancy uncomplicated so far, 20-week scan normal.','Faecal urgency persists occasionally; seeing a pelvic floor physio.','Anal sphincter ultrasound after the repair showed a small residual defect.','No medical conditions. BMI 24.'],
raise:['What are the risks of a caesarean for me and the baby?','Will it affect future pregnancies?']},
eq:[['When is caesarean recommended after a previous obstetric anal sphincter injury (OASIS)?','When the woman has ongoing anal incontinence symptoms or abnormal endoanal ultrasound/manometry. Otherwise, vaginal birth can be offered with about 5–7% risk of recurrence.']],
m:[['Introduces self, acknowledges her previous experience',2],['Takes antenatal history: progress, scans, complications',1],['Asks about ongoing bowel symptoms, dyspareunia, physio, investigations',2],['Explains the procedure: spinal anaesthetic, lower abdominal incision, ~1 hour, partner present',2],['Benefits: avoids further sphincter injury; planned timing (~39 weeks)',2],['Maternal risks: bleeding, infection, VTE, injury to bladder/bowel, longer recovery',2],['Future pregnancy risks: placenta praevia/accreta, uterine rupture, repeat CS',2],['Neonatal risks: transient tachypnoea, slightly higher NICU admission',1],['Notes recurrence risk of OASIS with vaginal birth and that CS is reasonable given ongoing symptoms',1],['Shared decision; refers to obstetrician; written information',2]],
ref:'RANZCOG Management of obstetric anal sphincter injury (OASIS); RANZCOG CS information.'},

{id:'rnh-c8',t:'Cervical Screening Test',k:['Hx','Couns'],yr:'2014, 2019',
role:'You are a GP registrar.',
stem:'Chloe Adams, 34, has come in for the results of her cervical screening test (CST), which she did 2 weeks ago. The result shows: "HPV 16/18 detected. Liquid-based cytology: negative." Her last screening test was 5 years ago and was normal.',
tasks:['Take a focused history, including a sexual and gynaecological history.','Explain the result to Chloe.','Outline the next steps.'],
script:{who:'Chloe, 34. Married for 8 years.',open:'The receptionist said I needed to come in for my results. Is it cancer?',
act:'Shocked; worried her husband has cheated.',
ask:['No postcoital or intermenstrual bleeding. No discharge.','Monogamous with husband for 10 years; 4 partners before that.','Smoker, 5/day.','Uses the combined pill.','Vaccinated against HPV? No (too old for school program).'],
raise:['Does this mean my husband cheated?','Do I have cancer?','Can I still have a baby?']},
eq:[['Why is she referred for colposcopy if cytology is normal?','HPV 16/18 carries the highest risk of high-grade lesions (CIN2/3) and cancer, so all HPV 16/18 results go directly to colposcopy regardless of cytology.']],
m:[['Introduces self, establishes what she knows, warns of result',1],['Gynae history: bleeding, discharge, pain, previous CSTs',2],['Sexual history taken sensitively (partners, contraception, STI)',2],['Smoking status',1],['Explains HPV: common, sexually transmitted, usually cleared',2],['Explains HPV can remain dormant for years; not evidence of infidelity',2],['Explains result: high-risk type, normal cells, not cancer',2],['Refers for colposcopy (directly for HPV 16/18)',2],['Explains colposcopy procedure briefly',1],['Smoking cessation advice; condoms; partner does not need testing',1],['Checks understanding; safety-nets for abnormal bleeding',1]],
ref:'National Cervical Screening Program clinical guidelines (Cancer Council Australia).'},

{id:'rnh-c9',t:'Post-dates Induction of Labour',k:'Couns',yr:'2020',
role:'You are a junior doctor in the antenatal clinic.',
stem:'Rachel Owen, 30, G1P0, is 40+5 weeks pregnant. Her pregnancy has been uncomplicated. Her obstetrician has recommended induction of labour at 41 weeks.',
tasks:['Explain why induction is recommended.','Describe the methods of induction of labour.','Discuss the risks and benefits.'],
script:{who:'Rachel, 30. Wants a natural birth.',open:'Why can\'t I just wait for labour to start on its own?',
act:'Open-minded but needs good reasons.',
ask:['Baby moving well. No bleeding or fluid loss.','Bishop score on exam today: 3.','Hoping for a drug-free birth.'],
raise:['What happens if I wait?','Does induction hurt more?','Will I end up with a caesarean?']},
eq:[['What is a Bishop score?','A score of cervical readiness: dilation, effacement (or length), station, consistency and position. A score of 6 or less (or under 8 in some protocols) suggests cervical ripening is needed first.']],
m:[['Introduces self, explores her understanding and wishes',1],['Explains risks of prolonged pregnancy: stillbirth risk rises after 41 weeks, meconium, macrosomia',2],['Membrane sweep explained as first, simple option',2],['Cervical ripening: prostaglandin gel/pessary or balloon catheter',2],['Artificial rupture of membranes and oxytocin infusion',2],['Risks: uterine hyperstimulation, failed induction, longer labour, more interventions',2],['Notes induction at 41 weeks does not increase caesarean rate vs waiting',1],['Offers the alternative: expectant management with increased monitoring (CTG, liquor)',1],['Pain relief options remain the same',1],['Shared decision; checks understanding; safety-nets (reduced movements, bleeding, ROM)',2]],
ref:'QCG Induction of labour; RANZCOG.'},

{id:'rnh-c10',t:'Vaginal Prolapse',k:['Hx','Couns'],yr:'2021',
role:'You are a GP registrar.',
stem:'Margaret Hill, 62, describes a feeling of "something coming down" in her vagina for 6 months.',
tasks:['Take a focused history.','Explain the likely diagnosis.','Discuss management options.'],
script:{who:'Margaret, 62. Embarrassed to talk about it.',open:'It feels like I\'m sitting on a ball, especially at the end of the day.',
act:'Quiet; opens up if put at ease.',
ask:['Dragging sensation, worse after standing or lifting grandchildren, better lying down.','Feels a bulge when washing.','Has to push the bulge back to fully empty her bladder. Some urgency, leaks with coughing.','No bleeding. Mild constipation.','4 vaginal births, largest 4.3 kg. Menopause at 52, no HRT.','Chronic cough (ex-smoker). BMI 31.','Sexually active, finds it uncomfortable.'],
raise:['Do I need surgery?','Is it cancer?']},
eq:[['What are the main types of prolapse?','Anterior wall (cystocele), posterior wall (rectocele/enterocele), and apical (uterine or vault) prolapse.']],
m:[['Introduces self, sensitive approach, ensures privacy',1],['Prolapse symptoms: bulge, dragging, timing',2],['Urinary symptoms: incomplete emptying, stress/urge incontinence, splinting',2],['Bowel symptoms and sexual function',1],['Risk factors: parity, large babies, menopause, chronic cough, obesity, constipation',2],['Red flags: postmenopausal bleeding, weight loss',1],['Explains prolapse in plain language; reassures not cancer',2],['Conservative: pelvic floor physio, weight loss, treat cough/constipation, vaginal oestrogen',2],['Pessary option explained',1],['Surgical options (repair, hysterectomy) if conservative fails; notes mesh is restricted',2],['Refers to gynaecology if symptomatic; follow-up plan',1]],
ref:'RANZCOG Pelvic organ prolapse; Continence Foundation of Australia.'},

{id:'rnh-c11',t:'Miscarriage',k:['Hx','Mx'],yr:'2022',
role:'You are a junior doctor in the emergency department.',
stem:'Sarah Patel, 32, presents with central lower abdominal cramping and vaginal bleeding. Her last menstrual period was 8 weeks ago and a urine pregnancy test is positive.',
tasks:['Take a focused history.','State the investigations you would order.','Explain the management options.'],
script:{who:'Sarah, 32, G2P1. Planned pregnancy.',open:'I\'m bleeding and I think I\'m losing the baby.',
act:'Tearful. Needs time and empathy.',
ask:['Bleeding started this morning, heavier than a period, passed some clots.','Crampy central pain, 6/10.','Not dizzy.','Has a 3-year-old. No previous miscarriages.','Blood group unknown this pregnancy.'],
raise:['Did I do something to cause this?','What happens now?'],
fx:['HR 84, BP 122/76. Abdomen soft, mild suprapubic tenderness.','Speculum: cervical os open, products of conception visible at os, removed.','TVUS: incomplete miscarriage, retained products 22 mm.']},
eq:[['When is anti-D needed after miscarriage?','For Rh D negative women with miscarriage requiring surgical evacuation, or after 12 weeks. Under 12 weeks with complete spontaneous miscarriage and no instrumentation it is generally not required (per National Blood Authority guidance).']],
m:[['Introduces self, empathic approach',2],['Bleeding: amount, clots, tissue passed, duration',2],['Pain characteristics; dizziness/syncope',1],['LMP, obstetric history, early scan results',1],['Excludes ectopic risk factors / features',1],['Investigations: beta-hCG, FBC, group and screen, TVUS',2],['Explains diagnosis sensitively',1],['Management options: expectant, medical (misoprostol), surgical (suction curettage)',3],['Considers anti-D according to Rh status',1],['Reassures: usually chromosomal, not her fault',2],['Follow-up and safety-net (heavy bleeding, fever, pain); support services',1]],
ref:'QCG Early pregnancy loss; National Blood Authority anti-D guideline.'},

{id:'rnh-c12',t:'PPROM',k:['Hx','Mx'],yr:'2023',
role:'You are a junior doctor in the birth suite.',
stem:'Amy Clarke, 27, G1P0, is 30 weeks pregnant. She reports a sudden gush of clear fluid from the vagina 3 hours ago and is still damp.',
tasks:['Take a focused history.','Interpret the examination findings and CTG given by the examiner.','Formulate a management plan.'],
script:{who:'Amy, 27. Worried.',open:'My pants were soaked and it keeps trickling. Did my waters break?',
act:'Anxious but cooperative.',
ask:['Clear fluid, no smell. Continues to leak.','No contractions, no bleeding.','Baby moving well.','No fever, no urinary symptoms.','Pregnancy uncomplicated. GBS status unknown.'],
raise:['Will the baby come now?','How long do I stay in hospital?'],
fx:['T 36.8 °C, HR 82, BP 116/72.','Sterile speculum: pooling of clear liquor in posterior fornix, cervix closed. Amnisure positive.','CTG: baseline 145, variability normal, accelerations present, no decelerations.']},
eq:[['What are the signs of chorioamnionitis?','Maternal fever, maternal or fetal tachycardia, uterine tenderness, offensive vaginal discharge, raised WCC/CRP.']],
m:[['Introduces self',1],['Fluid: time, colour, amount, smell, ongoing',2],['Asks contractions, bleeding, fetal movements',1],['Asks infection symptoms',1],['Interprets speculum findings as confirmed ROM',1],['Interprets CTG as normal/reassuring',2],['Avoids digital vaginal exam',1],['Admit; monitor for infection (temp, HR, CTG, FBC/CRP)',2],['Antibiotics: erythromycin for latency (± ampicillin per local protocol)',2],['Corticosteroids (betamethasone)',2],['Magnesium sulfate for neuroprotection if delivery imminent <30 weeks',1],['Plans delivery at ~37 weeks if no complications; neonatal team review',1],['Explains plan clearly to Amy',1]],
ref:'QCG Preterm prelabour rupture of membranes; RANZCOG.'},

{id:'rnh-c13',t:'Menorrhagia',k:['Hx','Couns'],yr:'2012',
role:'You are a GP registrar.',
stem:'Linda Park, 42, has noticed her periods getting much heavier over the last year.',
tasks:['Take a focused history.','Outline the investigations you would arrange.','Discuss management options.'],
script:{who:'Linda, 42. Teacher, mother of 3.',open:'I\'m flooding through pads at work. It\'s embarrassing.',
act:'Practical; wants it fixed.',
ask:['Periods every 28 days, 8 days long, changing a super pad every hour on days 1–3, clots like 50-cent coins.','No intermenstrual or postcoital bleeding.','Tired and short of breath on stairs.','Last CST 2 years ago, normal.','3 children, tubal ligation, family complete.','No bleeding disorder history. Not on anticoagulants.'],
raise:['Do I need a hysterectomy?','Is it cancer?']},
eq:[['What is the PALM-COEIN classification?','Structural: Polyp, Adenomyosis, Leiomyoma, Malignancy/hyperplasia. Non-structural: Coagulopathy, Ovulatory dysfunction, Endometrial, Iatrogenic, Not yet classified.']],
m:[['Introduces self',1],['Quantifies bleeding: frequency, duration, flooding, clots, pads',2],['Asks intermenstrual/postcoital bleeding, pain, pressure symptoms',1],['Anaemia symptoms',1],['Asks bleeding disorder history, medications, thyroid symptoms',1],['CST history, contraception, fertility wishes',2],['Investigations: FBC, iron studies, TSH, pelvic ultrasound (transvaginal)',2],['Considers endometrial sampling if risk factors (≥45, obesity, failed treatment)',1],['Medical: LNG-IUD (first line), tranexamic acid, NSAIDs, COCP, progestogens',2],['Iron replacement',1],['Surgical: endometrial ablation, hysterectomy if medical fails',1],['Shared decision; follow-up',1]],
ref:'ACSQHC Heavy Menstrual Bleeding Clinical Care Standard; eTG.'},

{id:'rnh-c14',t:'Sterilisation Counselling',k:'Couns',yr:'2011, 2013, 2016',
role:'You are a GP registrar.',
stem:'Ben Jordan, 38, and his wife have 3 children. They have decided they do not want any more and he has come to discuss permanent contraception.',
tasks:['Take a relevant history.','Counsel Ben about male and female sterilisation options.','Answer his questions.'],
script:{who:'Ben, 38. Partner Kylie, 36.',open:'My wife\'s sick of the pill, and we\'re done with kids. What\'s the snip involve?',
act:'Joking to hide nerves.',
ask:['Children aged 9, 6 and 2.','Relationship stable. Both agree.','No testicular problems or surgery. No bleeding disorder.','Kylie had 2 vaginal births and 1 caesarean.'],
raise:['Will it affect my sex life?','When can I stop using other contraception?','Can it be reversed?']},
eq:[['How do you confirm vasectomy success?','Semen analysis about 3 months (and at least 20 ejaculations) after the procedure, showing azoospermia. Use other contraception until then.']],
m:[['Introduces self, rapport',1],['Explores reasons, certainty, partner\'s views, future changes',2],['Relevant medical/surgical history',1],['Explains vasectomy: local anaesthetic, small incision, 20–30 min',2],['Vasectomy risks: bruising, infection, chronic scrotal pain, failure ~1 in 2,000',2],['Explains no effect on libido, erection or ejaculate volume',1],['Needs other contraception until semen analysis confirms azoospermia',2],['Female sterilisation: laparoscopic salpingectomy/clips under GA; higher risk',2],['Mentions LARC (IUD, implant) as reversible, equally effective alternatives',1],['Should be considered permanent; reversal not reliable or funded',1],['Checks understanding; written info; referral',1]],
ref:'RANZCOG; Family Planning Australia; eTG.'},

{id:'rnh-c15',t:'Abnormal Uterine Bleeding – Polyp',k:['Hx','Couns'],yr:'2015',
role:'You are a GP registrar.',
stem:'Nicole Ward, 38, has had bleeding between her periods for 3 months. A pelvic ultrasound has shown a 9 mm endometrial polyp with no suspicious features.',
tasks:['Take a focused gynaecological history.','Explain the ultrasound findings.','Discuss management.'],
script:{who:'Nicole, 38.',open:'The scan found something. Should I be worried?',
act:'Anxious about cancer.',
ask:['Spotting mid-cycle and after sex for 3 months.','Periods regular.','CST 1 year ago: HPV not detected.','Not pregnant, uses condoms. May want another child.','No weight loss. Not on tamoxifen.'],
raise:['Is it cancer?','Will removing it affect having a baby?']},
m:[['Introduces self',1],['Characterises intermenstrual and postcoital bleeding',2],['Menstrual history, contraception, pregnancy possibility',1],['CST history and STI risk',1],['Risk factors for endometrial pathology (age, BMI, tamoxifen, PCOS)',1],['Explains polyp in plain language: common, usually benign',2],['Explains small chance of malignancy; tissue diagnosis needed',1],['Management: hysteroscopic polypectomy with histology',2],['Explains procedure, day surgery, risks',2],['Does not affect fertility; may improve it',1],['Checks understanding; refers to gynaecology; safety-nets',2]],
ref:'RANZCOG; eTG.'},

{id:'rnh-c16',t:'Foetal Anomaly Screening',k:'Couns',yr:'2017',
role:'You are a GP registrar.',
stem:'Bec Fraser, 37, is 9 weeks pregnant with her first baby. She wants to know about tests to check whether her baby has Down syndrome or other conditions.',
tasks:['Explain the screening and diagnostic options available in pregnancy.','Answer Bec\'s questions.'],
script:{who:'Bec, 37. Accountant. Planned pregnancy after 2 years of trying.',open:'My friend had a test that told her the sex at 10 weeks. What tests should I have?',
act:'Wants clear numbers.',
ask:['No family history of genetic conditions.','Partner 40.','Not sure what she would do with a high-risk result.'],
raise:['What\'s the difference between screening and diagnosis?','Do any of the tests risk a miscarriage?','How much does it cost?']},
eq:[['What does the combined first trimester screen involve?','Nuchal translucency ultrasound at 11+0 to 13+6 weeks plus maternal serum free beta-hCG and PAPP-A (taken from 9–10 weeks), combined with maternal age to give a risk.']],
m:[['Introduces self, explores knowledge and values',2],['Explains screening vs diagnostic tests',2],['Combined first trimester screening: timing, detection ~85–90%, Medicare-funded',2],['NIPT: from 10 weeks, detection >99% for T21, not Medicare-funded (~$400–500), can tell sex',2],['Morphology scan at 18–20 weeks for structural anomalies',1],['CVS (11–14 weeks) and amniocentesis (from 15 weeks): diagnostic; miscarriage risk ~0.5% or less',2],['High-risk screen leads to offer of diagnostic test',1],['Testing is optional; non-directive counselling',2],['Mentions genetic counselling availability',1],['Checks understanding; written information',1]],
ref:'RANZCOG Prenatal screening and diagnostic testing for fetal chromosomal and genetic conditions.'},

{id:'rnh-c17',t:'Postmenopausal Bleeding',k:['Hx','Mx'],yr:'2018',
role:'You are a GP registrar.',
stem:'Patricia Young, 64, has noticed vaginal bleeding twice in the past month. Her periods stopped 12 years ago.',
tasks:['Take a focused history.','State the most important diagnosis to exclude.','Outline your investigations and referral.'],
script:{who:'Patricia, 64. Retired nurse.',open:'I thought I was finished with all that. I\'ve had some spotting.',
act:'Matter-of-fact but worried.',
ask:['Two episodes of light pink spotting in 4 weeks.','No pain or discharge.','Menopause at 52. No HRT.','BMI 36. Type 2 diabetes. Hypertension.','Nulliparous.','CST 3 years ago normal.','No breast cancer, no tamoxifen.'],
raise:['Is it cancer?','Do I need surgery?']},
eq:[['What endometrial thickness on ultrasound warrants further investigation?','In a woman with postmenopausal bleeding, endometrial thickness ≥4 mm requires sampling (hysteroscopy and biopsy). Persistent bleeding needs investigation regardless of thickness.']],
m:[['Introduces self',1],['Characterises bleeding: amount, frequency, postcoital',2],['Menopause age, HRT use, tamoxifen',1],['Endometrial cancer risk factors: obesity, diabetes, nulliparity, unopposed oestrogen, PCOS',2],['Asks systemic symptoms (weight loss)',1],['States endometrial cancer must be excluded',2],['Exam: abdominal, speculum, bimanual; CST if due',1],['Transvaginal ultrasound for endometrial thickness',2],['Urgent gynaecology referral for hysteroscopy and biopsy',2],['Explains plan honestly without false reassurance',2],['Safety-net and follow-up',1]],
ref:'RANZCOG; Cancer Australia optimal care pathway for endometrial cancer.'},

{id:'rnh-c18',t:'Contraception Counselling',k:['Hx','Couns'],yr:'2023',
role:'You are a GP registrar.',
stem:'Zoe Martin, 22, would like to discuss contraception. She has heard about "the rod in the arm".',
tasks:['Take a contraception-focused history, including a sexual history.','Briefly explain the contraceptive options.','Counsel Zoe about the etonogestrel implant.'],
script:{who:'Zoe, 22. University student.',open:'I keep forgetting the pill. My friend has the rod. Is that good?',
act:'Relaxed and chatty.',
ask:['On the combined pill, misses 2–3 per month.','LMP 2 weeks ago. Last unprotected sex 10 days ago.','One regular male partner for 6 months; condom use inconsistent.','Last STI check 1 year ago.','Smokes socially. Migraines without aura. No VTE history.'],
raise:['Does it hurt going in?','Will it make me put on weight?','What about my periods?']},
eq:[['How effective is the implant and how long does it last?','Over 99.9% effective (failure ~0.05%). Licensed for 3 years.']],
m:[['Introduces self, non-judgemental',1],['Current contraception, adherence, satisfaction',1],['Sexual history: partners, condom use, STI testing',2],['Pregnancy risk: LMP, unprotected sex (need pregnancy test before insertion)',2],['Contraindications: VTE, migraine with aura, smoking, breast cancer, liver disease',1],['Summarises options by effectiveness: LARC, pill, condoms',2],['Implant: small rod, local anaesthetic, inserted in upper arm',1],['Efficacy and duration; quick return to fertility',1],['Side effects: unpredictable bleeding (most common reason for removal), no evidence of weight gain',2],['Does not protect against STIs; recommends condoms and STI screen',2],['Checks understanding; books insertion; offers info sheet',1]],
ref:'Family Planning Australia; eTG Sexual and reproductive health; Australian STI Management Guidelines.'}
